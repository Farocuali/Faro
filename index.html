// ═══════════════════════════════════════════════════════════════════════════
// CITAR — APA 7 y Chicago 17 (sin IA) — lógica reutilizada
// ═══════════════════════════════════════════════════════════════════════════
function parseAutores(raw){
  if(!raw.trim()) return [];
  const parts=(raw.includes(";")||raw.includes("\n"))?raw.split(/[;\n]/).map(s=>s.trim()).filter(Boolean):[raw.trim()];
  return parts.map(p=>{
    if(p.includes(",")){ const [ap,...rest]=p.split(","); return {apellido:ap.trim(),nombre:rest.join(",").trim()}; }
    const tk=p.trim().split(/\s+/);
    if(tk.length===1) return {apellido:tk[0],nombre:""};
    return {apellido:tk[tk.length-1],nombre:tk.slice(0,-1).join(" ")};
  });
}
function inicial(n){ return n?n.split(/\s+/).map(x=>x[0]?.toUpperCase()+".").join(" "):""; }
function formatAutoresAPA(a){
  if(a.length===0) return lang==="en"?"[Unknown author]":"[Autor desconocido]";
  if(a.length===1) return `${a[0].apellido}, ${inicial(a[0].nombre)}`;
  if(a.length===2) return `${a[0].apellido}, ${inicial(a[0].nombre)}, & ${a[1].apellido}, ${inicial(a[1].nombre)}`;
  if(a.length<=20){ const i=a.slice(0,-1).map(x=>`${x.apellido}, ${inicial(x.nombre)}`).join(", "); return `${i}, & ${a.slice(-1)[0].apellido}, ${inicial(a.slice(-1)[0].nombre)}`; }
  return a.slice(0,19).map(x=>`${x.apellido}, ${inicial(x.nombre)}`).join(", ")+", ... "+a.slice(-1)[0].apellido+", "+inicial(a.slice(-1)[0].nombre);
}
function formatAutoresChicago(a){
  if(a.length===0) return (lang==="en"?"[Unknown author]":"[Autor desconocido]");
  if(a.length===1) return `${a[0].apellido}, ${a[0].nombre}`;
  const first=`${a[0].apellido}, ${a[0].nombre}`; const rest=a.slice(1).map(x=>`${x.nombre} ${x.apellido}`.trim());
  if(a.length===2) return `${first} y ${rest[0]}`;
  return `${first}, ${rest.slice(0,-1).join(", ")} y ${rest.slice(-1)[0]}`;
}
function citaTextoAPA(a,an){ const sf=lang==="en"?"n.d.":"s.f."; const sa=lang==="en"?"[n.a.]":"[s.a.]"; if(a.length===0)return `(${sa}, ${an||sf})`; if(a.length===1)return `(${a[0].apellido}, ${an||sf})`; if(a.length===2)return `(${a[0].apellido} & ${a[1].apellido}, ${an||sf})`; return `(${a[0].apellido} et al., ${an||sf})`; }
function citaTextoChicago(a,an){ const sf=lang==="en"?"n.d.":"s.f."; const sa=lang==="en"?"[n.a.]":"[s.a.]"; if(a.length===0)return `(${sa} ${an||sf})`; if(a.length===1)return `(${a[0].apellido} ${an||sf})`; if(a.length===2)return `(${a[0].apellido} ${lang==="en"?"and":"y"} ${a[1].apellido} ${an||sf})`; return `(${a[0].apellido} et al. ${an||sf})`; }
function generarCita(){
  const s=citarState; const autores=parseAutores(s.autores); const anioStr=s.anio||(lang==="en"?"n.d.":"s.f.");
  let apa="",chiAuFe="",chiNota=""; const tituloFull=s.titulo+(s.subtitulo?`: ${s.subtitulo}`:"");
  const nombres=autores.map(a=>`${a.nombre} ${a.apellido}`.trim()).join(", ")||(lang==="en"?"[Unknown author]":"[Autor desconocido]");
  if(s.tipo==="libro"){
    apa=`${formatAutoresAPA(autores)} (${anioStr}). *${tituloFull}*${s.edicion?` (${s.edicion} ed.)`:""}. ${s.editorial||lang==="en"?"[Publisher]":"[Editorial]"}.${s.doi?` https://doi.org/${s.doi.replace(/^https?:\/\/doi\.org\//,"")}`:""}`;
    chiAuFe=`${formatAutoresChicago(autores)}. ${anioStr}. *${tituloFull}*. ${s.lugar?s.lugar+": ":""}${s.editorial||"[Editorial]"}.`;

  } else if(s.tipo==="capitulo"){

  } else if(s.tipo==="articulo"){
    apa=`${formatAutoresAPA(autores)} (${anioStr}). ${tituloFull}. *${s.revista||lang==="en"?"[Journal]":"[Revista]"}*, ${s.volumen||"[vol.]"}${s.numero?`(${s.numero})`:""}, ${s.paginas||"[pp.]"}.${s.doi?` https://doi.org/${s.doi.replace(/^https?:\/\/doi\.org\//,"")}`:""}`;
    chiAuFe=`${formatAutoresChicago(autores)}. ${anioStr}. "${tituloFull}". *${s.revista||"[Revista]"}* ${s.volumen||"[vol.]"}${s.numero?`, no. ${s.numero}`:""}: ${s.paginas||"[pp.]"}.${s.doi?` https://doi.org/${s.doi.replace(/^https?:\/\/doi\.org\//,"")}.`:""}`;
    chiNota=`${nombres}, "${tituloFull}", *${s.revista||"[Revista]"}* ${s.volumen||"[vol.]"}${s.numero?`, no. ${s.numero}`:""} (${anioStr}): ${s.paginas||"[pp.]"}.`;
  } else if(s.tipo==="tesis"){
    const nl=s.nivelTesis==="doctoral"?"Tesis doctoral":"Tesis de maestría";
    apa=`${formatAutoresAPA(autores)} (${anioStr}). *${tituloFull}* [${nl}, ${s.universidad||lang==="en"?"[University]":"[Universidad]"}].`;
    chiAuFe=`${formatAutoresChicago(autores)}. ${anioStr}. "${tituloFull}". ${nl}, ${s.universidad||"[Universidad]"}.`;
    chiNota=`${nombres}, "${tituloFull}" (${nl}, ${s.universidad||"[Universidad]"}, ${anioStr}).`;
  } else if(s.tipo==="web"){
    apa=`${formatAutoresAPA(autores)} (${anioStr}). ${tituloFull}. *${s.sitio||lang==="en"?"[Website]":"[Sitio web]"}*. ${s.url||"[URL]"}`;
    chiAuFe=`${formatAutoresChicago(autores)}. ${anioStr}. "${tituloFull}". *${s.sitio||"[Sitio web]"}*. ${s.fechaAcceso?lang==="en"?`Accessed ${s.fechaAcceso}. `:`Consultado el ${s.fechaAcceso}. `:""}${s.url||"[URL]"}.`;
    chiNota=`${nombres}, "${tituloFull}", *${s.sitio||"[Sitio web]"}*, ${anioStr}, ${s.url||"[URL]"}.`;
  } else if(s.tipo==="informe"){
    apa=`${formatAutoresAPA(autores)} (${anioStr}). *${tituloFull}*. ${s.editorial||lang==="en"?"[Institution]":"[Institución]"}.${s.url?` ${s.url}`:""}`;
    chiAuFe=`${formatAutoresChicago(autores)}. ${anioStr}. *${tituloFull}*. ${s.lugar?s.lugar+": ":""}${s.editorial||"[Institución]"}.${s.url?` ${s.url}.`:""}`;
    chiNota=`${nombres}, *${tituloFull}* (${s.lugar?s.lugar+": ":""}${s.editorial||"[Institución]"}, ${anioStr})${s.paginas?`, ${s.paginas}`:""}.`;

async function runCitarAI(){
  const q=(document.getElementById("cita-ai-q")?.value||"").trim();
  if(!q){ showToast(lang==="en"?"Paste what you know about the text":"Pegá lo que sepas del texto"); return; }
  const st=document.getElementById("cita-ai-status"); if(st) st.textContent=t("citar.testing");
  const useGround=citarGrounding && groundingAvailable();
  const sys = lang==="en"
    ? `You are a bibliographic assistant. ${useGround?"USE Google Search to find and verify the actual reference data (author, year, exact title, publisher or journal, DOI). Do not invent: if you cannot confirm a field via search, leave it empty.":"Fill in only data you know with certainty; if in doubt, leave the field empty."} Return EXCLUSIVELY a valid JSON object (no text before or after, no backticks) with these keys (string; empty if not found): tipo (one of: libro, capitulo, articulo, tesis, web, informe), autores (format "Last, First; Last, First"), anio, titulo, subtitulo, editorial, lugar, edicion, revista, volumen, numero, paginas, doi, url, sitio, capLibro, capEditores, universidad.`
    : `Sos un asistente bibliográfico. ${useGround?"USÁ la búsqueda de Google para encontrar y verificar los datos reales de la referencia (autor, año, título exacto, editorial o revista, DOI). No inventes: si un dato no lo confirmás con la búsqueda, dejalo vacío.":"Completá solo con datos que conozcas con certeza; si dudás, dejá el campo vacío."} Devolvé EXCLUSIVAMENTE un objeto JSON válido (sin texto antes ni después, sin backticks) con estas claves (string; vacías si no las encontrás): tipo (uno de: libro, capitulo, articulo, tesis, web, informe), autores (formato "Apellido, Nombre; Apellido, Nombre"), anio, titulo, subtitulo, editorial, lugar, edicion, revista, volumen, numero, paginas, doi, url, sitio, capLibro, capEditores, universidad.`;
  try{
    const userMsg = useGround
      ? (lang==="en"?`Search the internet for the actual data of this reference and verify before responding: ${q}`:`Buscá en internet los datos reales de esta referencia y verificalos antes de responder: ${q}`)
      : q;
    let out=await callGemini(sys,userMsg,{maxTokens:700,temperature:0.1,grounding:useGround});
    out=out.replace(/```json|```/g,"").trim();
    const m=out.match(/\{[\s\S]*\}/); if(m) out=m[0];
    const data=JSON.parse(out);
    Object.keys(citarState).forEach(k=>{ if(data[k]!==undefined && data[k]!=="") citarState[k]=data[k]; });
    if(data.tipo && CITA_TIPOS.some(t=>t[0]===data.tipo)) citarState.tipo=data.tipo;
    let note,warn=false;
    if(useGround && (!lastSources||!lastSources.length)){ warn=true; note=t("citar.ai.warn.noground"); }
    else if(!useGround){ warn=true; note=t("citar.ai.warn.nomem"); }
    else { note=(lang==="en"?"✓ Sources: ":"✓ Fuentes: ")+lastSources.map(s=>`<a href="${esc(s.uri)}" target="_blank" rel="noopener" style="color:var(--green-mid)">${esc(s.title.slice(0,30))}</a>`).join(" · "); }
    showToast(t("toast.cita.completed"));
    render();
    const st2=document.getElementById("cita-ai-status"); if(st2){ st2.innerHTML=note; st2.className=warn?"warn-box":"tip"; st2.style.marginTop=".4rem"; }
  }catch(e){
    const st3=document.getElementById("cita-ai-status"); if(st3){ st3.className="warn-box"; st3.style.marginTop=".4rem"; st3.textContent=t("citar.ai.error"); }
  }
}

async function runRecomendar(){

  if(!q){ showToast(lang==="en"?"Describe the topic first":"Describí el tema primero"); return; }
  const useGround = recGrounding && groundingAvailable();
  recLoading=true; recOut=""; recErr=null; lastSources=[]; renderRecomendarView();
  let system=getRecomendarSystem()+"\n\n"+getNoFiller()+projectContext()+priorWorkContext();
  if(useGround) system+="\n\nIMPORTANTE — USÁ LA BÚSQUEDA DE GOOGLE: antes de proponer cualquier obra, BUSCÁ en Google para confirmar que existe y que sus datos son correctos (autor/a, año, título exacto, editorial o revista). Hacé búsquedas reales para CADA referencia. No incluyas ninguna obra que no hayas podido verificar con una búsqueda. Es preferible una lista más corta y verificada que una extensa con datos inventados.";
  const userMsg = useGround
    ? `Buscá en internet trabajos académicos reales sobre: ${q}.\nVerificá con la búsqueda que cada obra existe (autor/a, año, título, editorial o revista) antes de incluirla, y citá las fuentes.`
    : q;
  try{

    await streamGemini(system,userMsg,(ch)=>{ acc+=ch; recOut=acc; throttledStreamRender(()=>acc,"#rec-out"); },{maxTokens:8000,temperature:0.85,grounding:useGround});
    recOut=acc;

        ? {title:"⚠ Could not confirm web search",detail:"This response has no sources, so it probably came from memory and may contain invented data. Possible causes: the model did not perform the search (retry or be more specific), the daily quota (500/day) or token limit was exceeded, or the model is not Flash/Flash-Lite 2.5. Verify each reference before using it."}
        : {title:"⚠ No se pudo confirmar la búsqueda web",detail:"Esta respuesta no trae fuentes, así que probablemente salió de memoria y puede contener datos inventados. Posibles causas: el modelo no realizó la búsqueda para este pedido (reintentá o sé más específica con el tema), se agotó la cuota diaria (500/día) o el límite de tokens, o el modelo no es Flash/Flash-Lite 2.5. Verificá cada referencia antes de usarla."};
    } else if(!useGround){
      recErr=lang==="en"
        ? {title:"⚠ Web search disabled",detail:(recGrounding?"The chosen model does not allow free web search: use Flash 2.5 or Flash-Lite 2.5 in Settings.":"The «Search the web» toggle is off.")+" This response is from memory and may hallucinate references."}

    }

function _crc32(buf){
  let c, crc=0xFFFFFFFF;
  if(!_crc32.table){ const t=[]; for(let n=0;n<256;n++){ c=n; for(let k=0;k<8;k++){ c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); } t[n]=c>>>0; } _crc32.table=t; }
  const t=_crc32.table;
  for(let i=0;i<buf.length;i++){ crc=t[(crc^buf[i])&0xFF]^(crc>>>8); }
  return (crc^0xFFFFFFFF)>>>0;
}
function _u8(str){ return new TextEncoder().encode(str); }
function _zip(files){
  const enc=new TextEncoder(); const chunks=[]; let offset=0; const central=[];
  const dosTime=0, dosDate=0x21;
  for(const f of files){
    const nameB=enc.encode(f.name); const data=f.data; const crc=_crc32(data);
    const lh=new Uint8Array(30+nameB.length); const dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true); dv.setUint16(6,0,true); dv.setUint16(8,0,true);
    dv.setUint16(10,dosTime,true); dv.setUint16(12,dosDate,true); dv.setUint32(14,crc,true);
    dv.setUint32(18,data.length,true); dv.setUint32(22,data.length,true); dv.setUint16(26,nameB.length,true); dv.setUint16(28,0,true);
    lh.set(nameB,30); chunks.push(lh); chunks.push(data);
    const ch=new Uint8Array(46+nameB.length); const cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true); cv.setUint16(8,0,true); cv.setUint16(10,0,true);
    cv.setUint16(12,dosTime,true); cv.setUint16(14,dosDate,true); cv.setUint32(16,crc,true);
    cv.setUint32(20,data.length,true); cv.setUint32(24,data.length,true); cv.setUint16(28,nameB.length,true);
    cv.setUint16(30,0,true); cv.setUint16(32,0,true); cv.setUint16(34,0,true); cv.setUint16(36,0,true); cv.setUint32(38,0,true);
    cv.setUint32(42,offset,true); ch.set(nameB,46); central.push(ch);
    offset += lh.length + data.length;
  }
  let centralSize=0; central.forEach(x=>centralSize+=x.length); const centralOffset=offset;
  central.forEach(x=>chunks.push(x));
  const end=new Uint8Array(22); const ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(4,0,true); ev.setUint16(6,0,true);
  ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,centralSize,true); ev.setUint32(16,centralOffset,true); ev.setUint16(20,0,true);
  chunks.push(end);
  let total=0; chunks.forEach(x=>total+=x.length); const out=new Uint8Array(total); let p=0;
  chunks.forEach(x=>{ out.set(x,p); p+=x.length; }); return out;
}
function _xmlEsc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&apos;"); }
function _docxPara(b){
  const text=_xmlEsc(b.text||""); let pPr="", rPr="";
  if(b.type==="h1"){ pPr=`<w:pPr><w:spacing w:before="240" w:after="120"/></w:pPr>`; rPr=`<w:rPr><w:b/><w:sz w:val="34"/></w:rPr>`; }
  else if(b.type==="h2"){ pPr=`<w:pPr><w:spacing w:before="200" w:after="80"/><w:pBdr><w:bottom w:val="single" w:sz="6" w:space="2" w:color="999999"/></w:pBdr></w:pPr>`; rPr=`<w:rPr><w:b/><w:sz w:val="26"/></w:rPr>`; }
  else if(b.type==="h3"){ pPr=`<w:pPr><w:spacing w:before="160" w:after="50"/></w:pPr>`; rPr=`<w:rPr><w:b/><w:sz w:val="22"/><w:color w:val="2D6A4F"/></w:rPr>`; }
  else if(b.type==="quote"){ pPr=`<w:pPr><w:ind w:left="360"/><w:spacing w:after="60"/><w:shd w:val="clear" w:color="auto" w:fill="EDEDED"/></w:pPr>`; rPr=`<w:rPr><w:i/></w:rPr>`; }
  else if(b.type==="margin"){ pPr=`<w:pPr><w:spacing w:after="40"/></w:pPr>`; rPr=`<w:rPr><w:b/><w:sz w:val="16"/><w:color w:val="555555"/></w:rPr>`; }
  else if(b.type==="meta"){ pPr=`<w:pPr><w:spacing w:after="40"/></w:pPr>`; rPr=`<w:rPr><w:color w:val="555555"/><w:sz w:val="18"/></w:rPr>`; }
  else { pPr=`<w:pPr><w:spacing w:after="80"/></w:pPr>`; rPr=""; }
  const parts=text.split("\n"); let runs="";
  parts.forEach((pt,i)=>{ if(i>0) runs+="<w:br/>"; runs+=`<w:t xml:space="preserve">${pt}</w:t>`; });
  return `<w:p>${pPr}<w:r>${rPr}${runs}</w:r></w:p>`;

function buildDocxBytes(blocks){
  const body=blocks.map(_docxPara).join("");
  const documentXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134"/></w:sectPr></w:body></w:document>`;
  const contentTypes=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`;
  const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  return _zip([
    {name:"[Content_Types].xml", data:_u8(contentTypes)},
    {name:"_rels/.rels", data:_u8(rels)},
    {name:"word/document.xml", data:_u8(documentXml)},
  ]);
}
function downloadDocx(filename, blocks){
  try{
    const bytes=buildDocxBytes(blocks);
    const blob=new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
    const url=URL.createObjectURL(blob); const a=document.createElement("a");
    a.href=url; a.download=filename; document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); },100);
    showToast(t("toast.saved")+" Word");
  }catch(e){ console.error(e); showToast("No se pudo generar el Word"); }
}
// PDF mediante ventana de impresión limpia (Guardar como PDF) — gratis, sin librerías
function printAsPdf(title, blocks){
  const css=`body{font-family:Georgia,'Times New Roman',serif;color:#000;max-width:720px;margin:32px auto;padding:0 20px;line-height:1.6}
    h1{font-size:1.7rem;margin:.2rem 0 .3rem} h2{font-size:1.15rem;border-bottom:1px solid #999;padding-bottom:3px;margin:1.3rem 0 .5rem} h3{font-size:1rem;color:#2D6A4F;margin:.9rem 0 .3rem}
    .meta{color:#555;font-size:.82rem;margin:.1rem 0} .margin{font-weight:700;font-size:.72rem;color:#555;margin:.4rem 0 .1rem;letter-spacing:.3px}
    .quote{background:#ededed;border-radius:3px;padding:.4rem .6rem;margin:.1rem 0 .5rem;font-style:italic} p{margin:.2rem 0 .6rem}
    @media print{.noprint{display:none}}`;
  const html=blocks.map(b=>{
    const t=_xmlEsc(b.text||"").replace(/\n/g,"<br>");
    if(b.type==="h1") return `<h1>${t}</h1>`;
    if(b.type==="h2") return `<h2>${t}</h2>`;
    if(b.type==="h3") return `<h3>${t}</h3>`;
    if(b.type==="meta") return `<div class="meta">${t}</div>`;
    if(b.type==="margin") return `<div class="margin">${t}</div>`;
    if(b.type==="quote") return `<div class="quote">${t}</div>`;
    return `<p>${t}</p>`;
  }).join("");
  const w=window.open("","_blank");
  if(!w){ showToast(t("toast.popup.blocked")); return; }
  w.document.write(`<!doctype html><html lang="" ><head><meta charset="utf-8"><title>${_xmlEsc(title)}</title><style>${css}</style></head><body><div class="noprint" style="text-align:center;margin-bottom:18px"><button onclick="window.print()" style="padding:8px 16px;font-size:14px;cursor:pointer">🖨 Imprimir / Guardar como PDF</button></div>${html}<scr`+`ipt>setTimeout(function(){window.print();},400);</scr`+`ipt></body></html>`);
  w.document.close();
}

  const stepEs=(s,txt)=>`<div class="guide-step"><span class="gs-sym">${s}</span><div>${txt}</div></div>`;
  const stepEn=(s,txt)=>`<div class="guide-step guide-step-en"><span class="gs-sym">${s}</span><div>${txt}</div></div>`;

  openModal(`<div class="modal-head"><div class="modal-title">Guía de uso · User Guide</div><button class="modal-close" id="m-close">✕</button></div>
    <div class="modal-body" style="max-height:72vh">

      <!-- ══ ESPAÑOL ══ -->
      <div class="guide-lang-header" style="font-family:'IBM Plex Mono',monospace;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--green-mid);margin-bottom:.6rem;padding-bottom:.3rem;border-bottom:1px solid var(--border2)">🇦🇷 Español</div>
      <div class="guide-tip">FARO te acompaña en el análisis cualitativo: cargás materiales, los codificás y analizás, y después los explorás en profundidad. La IA es <strong>opcional</strong> (con tu propia clave gratuita de Gemini): todo funciona también a mano.</div>

      <div class="guide-sec">1 · Tu proyecto y tus materiales</div>
      ${stepEs("◈","Configurá tu proyecto (tema, objetivo, población, enfoque) desde Inicio: orienta a la IA en todas las secciones.")}
      ${stepEs("✎","En <strong>Materiales</strong> cargás notas de campo, entrevistas y bibliografía (TXT, MD, PDF, DOCX). Todo se procesa en tu navegador. También podés importar un audio para transcribir, o pegar un fragmento suelto.")}

      <div class="guide-sec">2 · Codificar y Analizar</div>
      ${stepEs("◈","<strong>Codificar</strong>: seleccioná texto y elegí «Guardar como código», «Escribir código vinculado» o «Vincular a uno existente». A la derecha generás códigos o pensás preguntas, con sugerencias de la IA si la activás.")}
      ${stepEs("◉","<strong>Analizar</strong>: escritura densa y vínculo con la bibliografía. Un análisis puede reunir <strong>varios fragmentos y textos</strong>: seleccioná un pasaje y elegí «Sumar a un análisis escrito», o tocá un análisis de la lista. La IA puede <strong>sugerir códigos a partir de un texto de bibliografía</strong>.")}
      ${stepEs("✕","<strong>Marcas</strong>: tocando una marca podés «Quitar el código de este fragmento» (queda como resaltado) o eliminar la marca por completo.")}

      <div class="guide-sec">3 · Agrupar códigos en categorías</div>
      ${stepEs("◆","En <strong>Nube → Agrupar códigos</strong> armás <strong>categorías</strong>: códigos que agrupan otros códigos. Es donde subís de nivel, de los códigos sueltos a tus grandes ejes de análisis.")}
      ${stepEs("＋","Escribí el nombre de la categoría, tildá los códigos que entran (un código puede estar en <strong>varias</strong> categorías) y guardá. A la izquierda navegás todo; a la derecha ves la categoría elegida y sus códigos como un grafo.")}

      <div class="guide-sec">4 · Trabajo en profundidad</div>
      ${stepEs("❖","Elegí un modo: <strong>por textos</strong>, <strong>por código</strong>, <strong>por categoría</strong> o <strong>por análisis</strong>, y seleccioná <strong>hasta 2 ítems</strong> del mismo tipo para abordarlos lado a lado.")}
      ${stepEs("▾","A la izquierda ves la evidencia (los textos completos resaltados, o los fragmentos del código/categoría/análisis). Cada bloque se <strong>abre y cierra</strong>.")}
      ${stepEs("▤","A la derecha, lo vinculado: códigos, coincidencias, análisis y recomendaciones. Tocá cualquiera para editarlo.")}
      ${stepEs("✓","El <strong>memo se guarda solo</strong> pegado a cada ítem. También podés guardar la selección como «trabajo» para reabrirla.")}
      ${stepEs("⤓","Descargás en <strong>Word</strong> (informe con textos y márgenes) o <strong>Excel</strong> (matriz de fragmentos). Los archivos se nombran con el nombre del ítem y la fecha.")}

      <div class="guide-sec">5 · Citar y Recomendar</div>
      ${stepEs("◎","<strong>Citar</strong>: APA 7 y Chicago 17 desde formulario; la IA puede completar datos faltantes (funciona sin IA).")}
      ${stepEs("◌","<strong>Recomendar bibliografía</strong>: búsqueda multilingüe sin sesgo Norte-Sur ni de género, con búsqueda web real opcional y fuentes citadas.")}

      <div class="guide-sec">6 · Dónde se guarda tu trabajo</div>
      <div class="device-warn" style="margin:.4rem 0 0">
        <strong>⚠ Todo se guarda solo en este navegador y este dispositivo.</strong> No se sincroniza ni se sube a ningún servidor. Para seguir en otra computadora o celular, usá <strong>«Respaldar / Descargar datos»</strong> y volvé a importar el archivo allá.
      </div>

      <div class="guide-sec">7 · Escribinos</div>
      <div class="guide-tip">Ante cualquier sugerencia, idea, opinión o experiencia pueden escribirnos.
        <div style="margin-top:.5rem"><button class="btn green sm" id="guide-mail-es">✉ Escribir a Faro.cuali@gmail.com</button></div>
      </div>

      <!-- ══ ENGLISH ══ -->
      <div class="guide-lang-header" style="font-family:'IBM Plex Mono',monospace;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--blue);margin:1.6rem 0 .6rem;padding-bottom:.3rem;border-bottom:1px solid var(--border2)">🇺🇸 English</div>
      <div class="guide-tip">FARO guides you through qualitative analysis: load materials, code and analyze them, then explore them in depth. AI is <strong>optional</strong> (with your own free Gemini key): everything works manually too.</div>

      <div class="guide-sec">1 · Your project and your materials</div>
      ${stepEn("◈","Set up your project (topic, objective, population, framework) from Home: it orients the AI across all sections.")}
      ${stepEn("✎","In <strong>Materials</strong> you load field notes, interviews, and bibliography (TXT, MD, PDF, DOCX). Everything is processed in your browser. You can also import audio to transcribe, or paste a loose excerpt.")}

      <div class="guide-sec">2 · Code and Analyze</div>
      ${stepEn("◈","<strong>Code</strong>: select text and choose «Save as code», «Write linked code», or «Link to existing». On the right you generate codes or think through questions, with AI suggestions if enabled.")}
      ${stepEn("◉","<strong>Analyze</strong>: thick writing linked to bibliography. An analysis can gather <strong>several excerpts and texts</strong>: select a passage and choose «Add to a written analysis», or tap one from the list. AI can <strong>suggest codes from a bibliography text</strong>.")}
      ${stepEn("✕","<strong>Marks</strong>: tapping a mark lets you «Remove code from this fragment» (leaves a highlight) or delete the mark entirely.")}

      <div class="guide-sec">3 · Group codes into categories</div>
      ${stepEn("◆","In <strong>Cloud → Group codes</strong> you build <strong>categories</strong>: codes that group other codes. This is where you move from scattered codes to your main analytical axes.")}
      ${stepEn("＋","Type the category name, tick the codes that belong (a code can belong to <strong>multiple</strong> categories), and save. On the left you navigate everything; on the right you see the chosen category and its codes as a graph.")}

      <div class="guide-sec">4 · In-depth work</div>
      ${stepEn("❖","Choose a mode: <strong>by texts</strong>, <strong>by code</strong>, <strong>by category</strong>, or <strong>by analysis</strong>, and select <strong>up to 2 items</strong> of the same type to work on side by side.")}
      ${stepEn("▾","On the left you see the evidence (full highlighted texts, or fragments per code/category/analysis). Each block <strong>opens and closes</strong>.")}
      ${stepEn("▤","On the right: linked codes, overlaps, analyses, and recommendations. Tap any to edit.")}
      ${stepEn("✓","The <strong>memo auto-saves</strong> attached to each item. You can also save the selection as a «work» to reopen it later.")}
      ${stepEn("⤓","Download as <strong>Word</strong> (report with texts and margin codes) or <strong>Excel</strong> (fragment matrix). Files are named with the item name and date.")}

      <div class="guide-sec">5 · Cite and Recommend</div>
      ${stepEn("◎","<strong>Cite</strong>: APA 7 and Chicago 17 from a form; AI can fill in missing data (works without AI).")}
      ${stepEn("◌","<strong>Recommend bibliography</strong>: multilingual search with no North-South or gender bias, with optional real web search and cited sources.")}

      <div class="guide-sec">6 · Where your work is saved</div>
      <div class="device-warn" style="margin:.4rem 0 0">
        <strong>⚠ Everything is saved only in this browser and this device.</strong> Not synced or uploaded to any server. To continue on another computer or phone, use <strong>«Backup / Download data»</strong> and import the file there.
      </div>

      <div class="guide-sec">7 · Write to us</div>
      <div class="guide-tip">For any suggestion, idea, opinion, or experience, you can write to us.
        <div style="margin-top:.5rem"><button class="btn green sm" id="guide-mail-en">✉ Write to Faro.cuali@gmail.com</button></div>
      </div>

    </div>
    <div class="modal-foot"><button class="btn green" id="m-ok">Entendido / Got it</button></div>`);
  document.getElementById("m-close").onclick=closeModal;
  document.getElementById("m-ok").onclick=closeModal;
  document.getElementById("guide-mail-es").onclick=openMail;
  document.getElementById("guide-mail-en").onclick=openMail;
}

// INIT / BOOT
// ═══════════════════════════════════════════════════════════════════════════
async function init(){
  let migratedNow=false;
  try{
    migratedNow = await loadState();
    await loadCreds();
  }catch(e){
    console.error(e);
  }
  applyTheme();
  document.documentElement.lang = lang === "en" ? "en" : "es";
  // header bindings
  document.getElementById("home-btn").onclick=()=>go("home");
  document.getElementById("theme-btn").onclick=async()=>{ await setTheme(!darkMode); applyTheme(); };
  document.getElementById("guide-btn").onclick=showUsageGuide;
  document.getElementById("mail-btn").onclick=openMail;
  document.getElementById("ai-toggle").onclick=async()=>{ await setAiOn(!aiOn); updateStatus(); render(); };
  // lang button
  initLangBtn();
  // indicador de scroll (sobre todo en celular)
  const sc=document.getElementById("content");
  const sh=document.getElementById("scroll-hint");
  if(sc&&sh){
    sc.addEventListener("scroll",updateScrollHint,{passive:true});
    sh.onclick=()=>sc.scrollBy({top:Math.round(sc.clientHeight*0.7),behavior:"smooth"});
  }
  window.addEventListener("resize",()=>{ renderSidebar(); updateScrollHint(); });
  initSearch();
  loaded=true;
  route="home";
  render();
  setSavePill("saved");
  // aviso discreto si se recuperaron datos de una sesión anterior
  if(migratedNow && (materials.length||savedCodes.length||savedAnalyses.length||project.tema)){
    setTimeout(()=>showToast(t("toast.session")),600);
  }
}
init();
</script>
