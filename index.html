<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,user-scalable=yes"/>
<title>FARO — Fichero Analítico de Registro y Observación</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet"/>
<!-- pdf.js — extracción local de PDFs, sin servidor -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  if (window.pdfjsLib) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }
</script>
<!-- mammoth.js — extracción local de .docx, sin servidor -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<!-- Cytoscape.js — grafos interactivos para Redes Semánticas y de Actores -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ── LIGHT THEME (predeterminado) ── */
[data-theme="light"]{
  --bg:#F5EDD4;--bg2:#FEFAF2;--bg3:#F0E8D0;
  --border:#C4B49A;--border2:#D4C9B0;
  --text:#1C1C14;--text2:#4A4032;--text3:#6E6048;--text4:#8E8068;
  --green-dark:#1E3A2F;--green-mid:#2D6A4F;--green-pale:#1A3328;
  --amber:#B85C38;--purple:#7B5EA7;--blue:#2A5A8C;
  --sidebar-bg:#1A3328;--sidebar-border:rgba(245,237,212,.08);
  --sidebar-text:#E8DFC8;--sidebar-sub:rgba(245,237,212,.42);
  --sidebar-section:rgba(245,237,212,.28);
  --card-bg:#FEFAF2;--card-border:#D4C9B0;
  --input-bg:#FEFAF2;--input-border:#C4B49A;
  --header-bg:rgba(245,237,212,.96);--header-border:#C4B49A;
  --toolbar-bg:rgba(245,237,212,.7);
  --zone-bg:rgba(245,237,212,.5);
  --annot-bg:#F5EDD4;
  --shadow:rgba(0,0,0,.08);--shadow2:rgba(0,0,0,.15);
  --hl-yellow:rgba(255,220,50,.45);--hl-yellow-h:rgba(255,220,50,.7);
  --hl-green:rgba(45,106,79,.18);--hl-green-b:rgba(45,106,79,.5);
  --code-bg:rgba(45,106,79,.1);--code-border:rgba(45,106,79,.25);
  --err-bg:rgba(184,92,56,.07);--err-border:rgba(184,92,56,.25);
  --badge-bg:rgba(184,92,56,.35);--badge-text:#8A4020;
  --toast-bg:#1E3A2F;--toast-text:#F5EDD4;
  --empty:#C4B49A;
  --hist-bg:rgba(254,250,242,.5);
  --scrollbar:#C4B49A;
  --intro-overlay:rgba(245,237,212,.98);
}

/* ── DARK THEME ── */
[data-theme="dark"]{
  --bg:#0F1A14;--bg2:#152019;--bg3:#0A1209;
  --border:#2A3D30;--border2:#1E2E25;
  --text:#E8DFC8;--text2:#B8A98A;--text3:#7A8A78;--text4:#4A5A48;
  --green-dark:#2D6A4F;--green-mid:#3D8A6A;--green-pale:#1E4030;
  --amber:#D4784A;--purple:#9B7EC7;--blue:#4A7AAC;
  --sidebar-bg:#0A1209;--sidebar-border:rgba(200,220,200,.06);
  --sidebar-text:#C8DACC;--sidebar-sub:rgba(200,220,200,.35);
  --sidebar-section:rgba(200,220,200,.22);
  --card-bg:#152019;--card-border:#1E2E25;
  --input-bg:#0F1A14;--input-border:#2A3D30;
  --header-bg:rgba(10,18,9,.96);--header-border:#1E2E25;
  --toolbar-bg:rgba(15,26,20,.9);
  --zone-bg:rgba(10,18,9,.6);
  --annot-bg:#0F1A14;
  --shadow:rgba(0,0,0,.3);--shadow2:rgba(0,0,0,.5);
  --hl-yellow:rgba(200,170,40,.3);--hl-yellow-h:rgba(200,170,40,.5);
  --hl-green:rgba(45,106,79,.3);--hl-green-b:rgba(45,106,79,.7);
  --code-bg:rgba(45,106,79,.15);--code-border:rgba(45,106,79,.35);
  --err-bg:rgba(184,92,56,.12);--err-border:rgba(184,92,56,.35);
  --badge-bg:rgba(212,120,74,.3);--badge-text:#E8C4A8;
  --toast-bg:#2D6A4F;--toast-text:#F0EDE0;
  --empty:#3A4A38;
  --hist-bg:rgba(21,32,25,.6);
  --scrollbar:#2A3D30;
  --intro-overlay:rgba(10,18,9,.98);
}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:4px}

html,body{height:100%}
body{
  font-family:'Lora',serif;
  background:var(--bg);
  color:var(--text);
  -webkit-text-size-adjust:100%;
  transition:background .3s,color .3s;
}
em{font-family:'Cormorant Garamond',serif;font-style:italic;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}

/* ════════ INICIO (estética original) ════════ */
.intro-box{
  max-width:640px;width:100%;text-align:center;margin:auto;padding:1.5rem 0 1rem;
  animation:introIn .6s cubic-bezier(.16,1,.3,1) both;
}
@keyframes introIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.intro-sigil{font-size:2.2rem;margin-bottom:.9rem;opacity:.7;animation:float 4s ease-in-out infinite;color:var(--green-mid);}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.intro-title{font-family:'Cormorant Garamond',serif;font-size:clamp(1.6rem,5vw,2.5rem);font-weight:300;color:var(--text);letter-spacing:.04em;margin-bottom:.25rem;line-height:1.15;}
.intro-title em{color:var(--amber);font-style:italic;}
.intro-subtitle{font-family:'IBM Plex Mono',monospace;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text3);margin-bottom:1.5rem;}
.intro-divider{width:36px;height:1px;background:var(--border);margin:.7rem auto 1.1rem;}
.intro-desc{font-family:'Lora',serif;font-size:clamp(.82rem,2.2vw,.92rem);line-height:1.8;color:var(--text2);margin-bottom:1.4rem;text-align:left;max-width:500px;margin-left:auto;margin-right:auto;}
.intro-features{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem;margin-bottom:1.5rem;text-align:left;}
@media(max-width:480px){.intro-features{grid-template-columns:1fr;gap:.4rem;}}
.intro-feat{display:flex;align-items:flex-start;gap:.5rem;padding:.6rem .7rem;background:var(--card-bg);border:1px solid var(--border2);border-radius:6px;transition:border-color .15s,transform .15s,box-shadow .2s;cursor:pointer;text-align:left;width:100%;}
.intro-feat:hover{border-color:var(--green-mid);transform:translateY(-2px);box-shadow:0 4px 12px var(--shadow);}
.intro-feat-sym{font-size:.95rem;flex-shrink:0;margin-top:.05rem;}
.intro-feat-text{font-family:'IBM Plex Mono',monospace;font-size:.58rem;letter-spacing:.05em;color:var(--text2);line-height:1.55;}
.intro-feat-title{font-family:'Cormorant Garamond',serif;font-size:.86rem;font-weight:600;color:var(--text);display:block;margin-bottom:.08rem;}
.intro-aitag{font-family:'IBM Plex Mono',monospace;font-size:.42rem;font-weight:400;letter-spacing:.1em;text-transform:uppercase;background:rgba(45,106,79,.18);color:#5A9A7A;padding:.05rem .28rem;border-radius:2px;margin-left:.3rem;vertical-align:middle;}
.intro-note{font-family:'IBM Plex Mono',monospace;font-size:.5rem;letter-spacing:.08em;color:var(--text4);margin-top:.85rem;text-transform:uppercase;line-height:1.7;}

/* ════════ APP SHELL ════════ */
.app{display:flex;flex-direction:column;min-height:100vh;}
.hdr{
  position:sticky;top:0;z-index:80;
  display:flex;align-items:center;gap:.5rem;
  padding:.6rem 1rem;background:var(--header-bg);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--header-border);
  min-width:0;
}
.hdr-left{display:flex;align-items:center;gap:.6rem;flex:1;min-width:0;overflow:hidden;}
.hdr-home-btn{
  background:none;border:1px solid var(--border);color:var(--text2);
  width:34px;height:34px;border-radius:8px;font-size:1rem;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
.hdr-home-btn:hover{background:var(--bg3);color:var(--green-mid);border-color:var(--green-mid);}
.hdr-titles{min-width:0;overflow:hidden;}
.hdr-title{font-family:'Cormorant Garamond',serif;font-size:1.15rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-sub{font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:1px;text-transform:uppercase;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-right{display:flex;align-items:center;gap:.5rem;flex-shrink:0;}
.hdr-status{display:none;align-items:center;gap:.4rem;font-size:.7rem;color:var(--text3);font-family:'IBM Plex Mono',monospace;}
@media(min-width:760px){.hdr-status{display:flex;}}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);}
.save-pill{font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.5px;padding:3px 8px;border-radius:20px;border:1px solid var(--border);color:var(--text3);white-space:nowrap;transition:.3s;flex-shrink:0;}
.save-pill.saving{color:var(--amber);border-color:var(--amber);}
.save-pill.saved{color:var(--green-mid);border-color:var(--green-mid);}
.save-pill.dirty{color:var(--text3);}
/* ── SEARCH BUTTON ── */
.search-hdr-btn{font-size:1.05rem!important;}
/* ── GLOBAL SEARCH OVERLAY ── */
.search-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:10vh 1rem 2rem;}
.search-overlay.open{display:flex;}
.search-box{background:var(--bg2);border:1px solid var(--border);border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden;display:flex;flex-direction:column;max-height:70vh;}
.search-input-row{display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;border-bottom:1px solid var(--border2);}
.search-icon{font-size:1.1rem;color:var(--text3);flex-shrink:0;}
.search-input-row input{flex:1;background:transparent;border:none;outline:none;font-size:1rem;color:var(--text);font-family:'Lora',serif;}
.search-input-row input::placeholder{color:var(--text4);}
.search-esc-hint{font-family:'IBM Plex Mono',monospace;font-size:.58rem;padding:2px 6px;border:1px solid var(--border);border-radius:4px;color:var(--text3);flex-shrink:0;}
.search-filters{display:flex;gap:.4rem;padding:.5rem .9rem;border-bottom:1px solid var(--border2);flex-wrap:wrap;}
.search-filter{font-size:.68rem;font-family:'IBM Plex Mono',monospace;letter-spacing:.4px;padding:.25rem .65rem;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;transition:.15s;}
.search-filter.active{background:var(--green-dark);color:var(--sidebar-text);border-color:var(--green-dark);}
.search-results{overflow-y:auto;flex:1;}
.search-result-item{padding:.65rem 1rem;border-bottom:1px solid var(--border2);cursor:pointer;transition:.12s;}
.search-result-item:hover,.search-result-item.focused{background:var(--bg3);}
.search-result-item:last-child{border-bottom:none;}
.sr-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.2rem;}
.sr-cat{font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.5px;text-transform:uppercase;color:var(--text4);flex-shrink:0;}
.sr-name{font-size:.88rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sr-snippet{font-size:.78rem;color:var(--text2);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.sr-snippet mark{background:var(--hl-yellow);border-radius:2px;padding:0;font-style:normal;}
.search-empty{padding:2rem 1rem;text-align:center;color:var(--text3);font-size:.85rem;}
.search-empty-title{font-size:.95rem;margin-bottom:.5rem;color:var(--text2);}
.search-quicklinks{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-top:.8rem;}
.search-quicklink{font-size:.75rem;padding:.3rem .75rem;border:1px solid var(--border);border-radius:20px;background:transparent;color:var(--text2);cursor:pointer;transition:.15s;}
.search-quicklink:hover{background:var(--bg3);}

@keyframes fadeUp{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
/* ocultar save-pill en pantallas muy chicas para no pisar el título */
@media(max-width:480px){.save-pill{display:none;}}
.ai-toggle{display:flex;align-items:center;gap:.4rem;cursor:pointer;padding:4px 8px;border-radius:20px;border:1px solid var(--border);user-select:none;}
.ai-toggle-label{font-family:'IBM Plex Mono',monospace;font-size:.65rem;letter-spacing:1px;color:var(--text2);}
.ai-switch{width:30px;height:16px;border-radius:10px;background:var(--border);position:relative;transition:.2s;}
.ai-switch::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:var(--bg2);top:2px;left:2px;transition:.2s;}
.ai-switch.on{background:var(--green-mid);}
.ai-switch.on::after{left:16px;}
.theme-btn{background:none;border:1px solid var(--border);width:34px;height:34px;border-radius:8px;font-size:.95rem;display:flex;align-items:center;justify-content:center;transition:.15s;color:var(--text);}
.theme-btn:hover{background:var(--bg3);border-color:var(--green-mid);color:var(--green-mid);}
[data-theme="dark"] .theme-btn{color:#C8DACC;border-color:rgba(200,220,200,.25);}
[data-theme="dark"] .theme-btn:hover{background:rgba(45,106,79,.3);border-color:var(--green-mid);color:#C8FFCC;}

.layout{display:flex;flex:1;min-height:0;}
.sidebar{
  width:230px;flex-shrink:0;background:var(--sidebar-bg);
  padding:1rem .7rem;overflow-y:auto;position:sticky;top:53px;
  height:calc(100vh - 53px);
}
.content{flex:1;min-width:0;display:flex;flex-direction:column;}
.content-scroll{flex:1;overflow-y:auto;scroll-behavior:smooth;}

/* sidebar items */
.s-sec{font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--sidebar-section);margin:1rem .5rem .4rem;}
.s-div{border:none;border-top:1px solid var(--sidebar-border);margin:.8rem .3rem;}
.s-btn{
  width:100%;display:flex;align-items:center;gap:.6rem;text-align:left;
  background:none;border:none;padding:.55rem .6rem;border-radius:8px;color:var(--sidebar-text);
  transition:background .15s;margin-bottom:1px;
}
.s-btn:hover{background:rgba(255,255,255,.05);}
.s-btn.active{background:rgba(255,255,255,.1);}
.s-btn.s-locked{opacity:.55;}
.s-sym{font-size:1.05rem;flex-shrink:0;width:20px;text-align:center;}
.s-texts{display:flex;flex-direction:column;min-width:0;flex:1;}
.s-name{font-size:.86rem;font-weight:500;display:flex;align-items:center;gap:.35rem;}
.s-sub{font-size:.66rem;color:var(--sidebar-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.s-aitag{font-family:'IBM Plex Mono',monospace;font-size:.52rem;background:rgba(45,106,79,.4);color:#A8D8BC;padding:0 4px;border-radius:3px;letter-spacing:.5px;}
.s-badge{background:var(--green-mid);color:#fff;font-size:.62rem;font-family:'IBM Plex Mono',monospace;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;}
.s-lock{color:var(--sidebar-sub);font-size:.9rem;}
.s-footer{font-family:'IBM Plex Mono',monospace;font-size:.6rem;line-height:1.6;color:var(--sidebar-sub);text-align:center;margin-top:2rem;padding-top:1rem;border-top:1px solid var(--sidebar-border);}
.s-backup-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:.5rem;margin-top:.6rem;padding:.7rem .6rem;border-radius:9px;border:1px solid rgba(245,237,212,.25);background:rgba(45,106,79,.28);color:var(--sidebar-text);font-weight:600;font-size:.82rem;transition:.15s;}
.s-backup-btn:hover{background:var(--green-mid);border-color:var(--green-mid);transform:translateY(-1px);}
.s-backup-sym{font-size:1rem;}

/* mobile sidebar → bottom bar */
@media(max-width:760px){
  .layout{flex-direction:column;}
  .sidebar{
    position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;
    display:flex;overflow-x:auto;overflow-y:hidden;padding:.4rem .5rem;gap:.3rem;
    z-index:70;border-top:1px solid var(--sidebar-border);
  }
  .s-sec,.s-div,.s-footer{display:none;}
  .s-backup-btn{width:auto;min-width:56px;flex-direction:column;gap:.1rem;margin-top:0;padding:.4rem .5rem;}
  .s-backup-txt{font-size:.55rem;}
  .s-btn{flex-direction:column;width:auto;min-width:62px;gap:.15rem;padding:.4rem .5rem;text-align:center;}
  .s-sub{display:none;}
  .s-name{font-size:.62rem;flex-direction:column;}
  .s-badge{position:absolute;}
  .content-scroll{padding-bottom:70px;}
}

/* ════════ COMMON UI ════════ */
.wrap{max-width:1100px;margin:0 auto;padding:1.2rem 1.2rem 3rem;width:100%;}
.breadcrumbs{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;font-size:.74rem;color:var(--text3);font-family:'IBM Plex Mono',monospace;padding:.7rem 1.2rem .2rem;max-width:1100px;margin:0 auto;width:100%;}
.crumb{background:none;border:none;color:var(--text3);padding:0;font-size:.74rem;font-family:inherit;}
.crumb.link{color:var(--green-mid);cursor:pointer;}
.crumb.link:hover{text-decoration:underline;}
.crumb-sep{color:var(--text4);}
.crumb.current{color:var(--text2);}

.page-head{margin-bottom:1.2rem;}
.page-title{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:600;display:flex;align-items:center;gap:.5rem;}
.page-sub{font-size:.86rem;color:var(--text2);margin-top:.25rem;line-height:1.5;max-width:680px;}

.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1.05rem;border-radius:7px;font-size:.84rem;font-weight:500;border:1px solid transparent;transition:.15s;}
.btn.green{background:var(--green-dark);color:var(--sidebar-text);}
.btn.green:hover{background:var(--green-mid);}
.btn.outline{background:transparent;border-color:var(--border);color:var(--text2);}
.btn.outline:hover{border-color:var(--green-mid);color:var(--green-mid);}
.btn.amber{background:var(--amber);color:#fff;}
.btn.danger{background:transparent;border-color:var(--amber);color:var(--amber);}
.btn.danger:hover{background:var(--amber);color:#fff;}
.btn.sm{padding:.35rem .7rem;font-size:.76rem;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.tip{font-size:.76rem;color:var(--text3);font-style:italic;font-family:'Cormorant Garamond',serif;line-height:1.5;}
.tooltip-hint{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--text4);color:var(--text3);font-size:.6rem;cursor:help;margin-left:.3rem;}

.field-label{display:block;font-size:.74rem;font-weight:600;color:var(--text2);margin-bottom:.3rem;letter-spacing:.3px;}
.field-in,.field-ta,.field-sel{
  width:100%;background:var(--input-bg);border:1px solid var(--input-border);
  border-radius:7px;padding:.6rem .7rem;font-size:.88rem;color:var(--text);transition:border .15s;
}
.field-ta{resize:vertical;min-height:80px;line-height:1.6;}
.field-in:focus,.field-ta:focus,.field-sel:focus{outline:none;border-color:var(--green-mid);}
.field-row{margin-bottom:.9rem;}
.field-2col{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;}
@media(max-width:620px){.field-2col{grid-template-columns:1fr;}}

.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:10px;padding:1rem;box-shadow:0 1px 3px var(--shadow);}
.empty-state{text-align:center;padding:2.5rem 1rem;color:var(--empty);}
.empty-sigil{font-size:2rem;opacity:.4;margin-bottom:.5rem;}
.empty-text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.95rem;color:var(--text2);line-height:1.5;}

.toast{
  position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--toast-bg);color:var(--toast-text);padding:.7rem 1.3rem;border-radius:8px;
  font-size:.84rem;z-index:2000;box-shadow:0 6px 20px var(--shadow2);opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media(max-width:760px){.toast{bottom:80px;}}

/* ════════ HOME DASHBOARD ════════ */
.home-hero{text-align:center;padding:1.5rem 0 1rem;}
.home-sigil{font-size:2rem;color:var(--green-mid);}
.home-title{font-family:'Cormorant Garamond',serif;font-size:2.1rem;font-weight:600;margin-top:.3rem;}
.home-proj{font-size:.9rem;color:var(--text2);margin-top:.4rem;font-style:italic;font-family:'Cormorant Garamond',serif;}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem;margin-top:1.6rem;}
.home-card{
  text-align:left;background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;
  padding:1.1rem;transition:transform .15s,box-shadow .2s,border-color .2s;display:flex;flex-direction:column;gap:.4rem;
}
.home-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px var(--shadow);border-color:var(--green-mid);}
.home-card-sym{font-size:1.5rem;}
.home-card-title{font-size:1rem;font-weight:600;display:flex;align-items:center;gap:.4rem;}
.home-card-desc{font-size:.78rem;color:var(--text2);line-height:1.5;}
.home-card-stat{font-family:'IBM Plex Mono',monospace;font-size:.66rem;color:var(--text3);margin-top:.3rem;}
.home-section-label{font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin:1.8rem 0 .2rem;}

/* ════════ SPLIT-SCREEN MODULE ════════ */
.split{display:flex;gap:0;height:calc(100vh - 53px);}
.split-left{flex:1;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--border);}
.split-right{width:420px;flex-shrink:0;display:flex;flex-direction:column;background:var(--bg2);}
@media(max-width:900px){
  .split{flex-direction:column;height:auto;}
  .split-left{border-right:none;border-bottom:1px solid var(--border);}
  .split-right{width:100%;}
}
.split-toolbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;padding:.6rem .9rem;border-bottom:1px solid var(--border);background:var(--toolbar-bg);position:sticky;top:0;z-index:10;}
.split-doc-name{font-weight:600;font-size:.86rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.split-body{flex:1;overflow-y:auto;padding:1.4rem 1.6rem;}
.doc-text{font-size:1rem;line-height:1.9;color:var(--text);white-space:pre-wrap;word-wrap:break-word;font-family:'Lora',serif;text-align:justify;hyphens:auto;}
.doc-text mark{background:var(--hl-yellow);border-radius:2px;padding:0 1px;cursor:pointer;transition:background .15s;}
.doc-text mark:hover{background:var(--hl-yellow-h);}
.doc-text mark.coded{background:var(--hl-green);border-bottom:2px solid var(--hl-green-b);}
.doc-text mark.coded:hover{background:var(--hl-green-b);}
.doc-text mark.ai-suggest{background:transparent;border-bottom:2px dotted var(--purple);}
.doc-text mark.flash{animation:flashmark 1.6s ease;}
.doc-text mark.pending{background:var(--hl-yellow-h);outline:2px dashed var(--amber);outline-offset:1px;border-radius:2px;}
.deep-frag.flash{animation:fragflash 1.6s ease;}
@keyframes fragflash{0%{box-shadow:0 0 0 3px var(--amber);}100%{box-shadow:none;}}
@keyframes flashmark{0%,40%{background:var(--amber);}100%{background:var(--hl-green);}}

/* contextual menu on text selection */
.ctx-menu{position:fixed;z-index:500;background:var(--card-bg);border:1px solid var(--border);border-radius:9px;box-shadow:0 8px 24px var(--shadow2);padding:.3rem;display:none;flex-direction:column;min-width:210px;}
.ctx-menu.show{display:flex;}
.ctx-item{display:flex;align-items:center;gap:.5rem;background:none;border:none;text-align:left;padding:.5rem .6rem;border-radius:6px;font-size:.8rem;color:var(--text);}
.ctx-item:hover{background:var(--bg3);}
.ctx-item .ci-sym{color:var(--green-mid);font-size:.9rem;width:16px;}

/* right panel tabs */
.tool-tabs{display:flex;flex-wrap:wrap;gap:.3rem;padding:.6rem .7rem;border-bottom:1px solid var(--border);background:var(--toolbar-bg);position:sticky;top:0;z-index:5;}
.tool-tab{font-size:.72rem;padding:.35rem .6rem;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text2);transition:.15s;line-height:1.3;}
.tool-tab:hover{border-color:var(--green-mid);}
.tool-tab.active{background:var(--green-dark);color:var(--sidebar-text);border-color:var(--green-dark);}
.tool-panel{flex:1;overflow-y:auto;padding:1rem;}
.panel-sec-title{font-family:'Cormorant Garamond',serif;font-size:1.15rem;font-weight:600;color:var(--green-mid);margin-bottom:.3rem;}
.panel-sec-desc{font-size:.76rem;color:var(--text3);margin-bottom:.7rem;line-height:1.5;}

.usercode-chip{display:inline-flex;align-items:center;gap:.3rem;background:var(--code-bg);border:1px solid var(--code-border);color:var(--green-mid);padding:.2rem .55rem;border-radius:14px;font-size:.74rem;margin:.15rem;}
.usercode-chip button{background:none;border:none;color:var(--text3);font-size:.8rem;padding:0;line-height:1;}
.codelist{display:flex;flex-wrap:wrap;gap:.2rem;margin:.5rem 0;}
.codelist-item{display:inline-flex;align-items:center;gap:.3rem;background:var(--bg3);border:1px solid var(--border);padding:.2rem .55rem;border-radius:14px;font-size:.74rem;color:var(--text2);}
.codelist-item:hover{border-color:var(--green-mid);color:var(--green-mid);}
.hscroll{display:flex;gap:.35rem;overflow-x:auto;padding-bottom:.4rem;}
.hscroll>*{flex-shrink:0;white-space:nowrap;}
.enfoque-box{margin:.6rem 0;border:1px solid var(--border);border-radius:8px;background:var(--bg3);}
.enfoque-box>summary{cursor:pointer;padding:.5rem .7rem;font-size:.78rem;color:var(--text2);list-style:none;}
.enfoque-box>summary::-webkit-details-marker{display:none;}
.enfoque-box[open]>summary{border-bottom:1px solid var(--border);}
.enfoque-opts{display:flex;flex-wrap:wrap;gap:.3rem;padding:.6rem .7rem;}
.enf-opt{font-size:.72rem;padding:.3rem .6rem;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--text2);}
.enf-opt.active{background:rgba(123,94,167,.15);border-color:var(--purple);color:var(--purple);}

.ai-box{background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:.8rem;margin-top:.8rem;}
.ai-box-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem;}
.ai-box-label{font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:1px;text-transform:uppercase;color:var(--purple);}
.ai-out{font-size:.86rem;line-height:1.7;max-height:none;overflow:visible;word-wrap:break-word;}
.ai-out .md-sec{font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:1px;text-transform:uppercase;color:var(--green-mid);margin:.9em 0 .3em;font-weight:600;}
.ai-out .md-bul{display:flex;gap:.4rem;margin:.2em 0;}
.ai-out .md-dot{color:var(--green-mid);}
.ai-out code{font-family:'IBM Plex Mono',monospace;}
.ai-sugg-code{display:inline-flex;align-items:center;gap:.3rem;background:rgba(123,94,167,.12);border:1px solid rgba(123,94,167,.3);color:var(--purple);padding:.2rem .55rem;border-radius:14px;font-size:.74rem;margin:.15rem;}
.ai-sugg-code button{background:none;border:none;color:var(--purple);font-size:.85rem;padding:0;font-weight:700;}

.dots{display:inline-flex;gap:3px;}
.dots .dot{width:5px;height:5px;border-radius:50%;background:currentColor;animation:bd 1s infinite;}
.dots .dot:nth-child(2){animation-delay:.2s;}
.dots .dot:nth-child(3){animation-delay:.4s;}
@keyframes bd{0%,80%,100%{opacity:.3}40%{opacity:1}}
.cursor-blink{display:inline-block;width:7px;height:1em;background:var(--green-mid);animation:bl 1s infinite;vertical-align:text-bottom;}
@keyframes bl{50%{opacity:0}}

/* ════════ NUBE / CONCEPT MAP ════════ */
.nube-tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.2rem;}
.nube-tab{font-size:.78rem;padding:.4rem .8rem;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--text2);}
.nube-tab.active{background:var(--green-dark);color:var(--sidebar-text);border-color:var(--green-dark);}
.concept-map{display:flex;flex-wrap:wrap;gap:.8rem;align-items:flex-start;}
.concept-node{
  background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;padding:.7rem 1rem;
  display:flex;flex-direction:column;gap:.3rem;transition:transform .15s,box-shadow .2s,border-color .2s;cursor:pointer;
  border-left:4px solid var(--green-mid);
}
.concept-node:hover{transform:translateY(-3px);box-shadow:0 8px 18px var(--shadow);border-color:var(--green-mid);}
.concept-node-name{font-weight:600;font-size:.96rem;}
.concept-node-meta{font-family:'IBM Plex Mono',monospace;font-size:.66rem;color:var(--text3);display:flex;gap:.7rem;flex-wrap:wrap;}
.concept-node-freq{display:inline-flex;align-items:center;justify-content:center;background:var(--green-mid);color:#fff;border-radius:12px;min-width:22px;height:22px;padding:0 7px;font-size:.72rem;}
.concept-node-origins{font-size:.72rem;color:var(--text2);line-height:1.4;}
.code-row{background:var(--card-bg);border:1px solid var(--card-border);border-radius:9px;margin-bottom:.5rem;overflow:hidden;}
.code-row-head{display:flex;align-items:center;gap:.6rem;padding:.7rem .9rem;cursor:pointer;}
.code-row-head:hover{background:var(--bg3);}
.code-row-name{font-weight:600;font-size:.92rem;flex:1;}
.code-row-caret{color:var(--text3);}
.code-row-body{padding:.3rem .6rem .7rem;display:flex;flex-direction:column;gap:.3rem;}
.gotomat{text-align:left;background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:.45rem .6rem;font-size:.8rem;color:var(--text);}
.gotomat:hover{border-color:var(--green-mid);color:var(--green-mid);}

/* ════════ REDES (semántica + actores) ════════ */
.red-wrap{display:flex;flex-direction:column;gap:1rem;}
.red-toolbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;}
.red-toolbar .field-sel{width:auto;font-size:.8rem;padding:.35rem .6rem;}
.red-cy-shell{
  position:relative;width:100%;height:520px;
  background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;
  overflow:hidden;
}
@media(max-width:760px){.red-cy-shell{height:380px;}}
#cy-semantica,#cy-actores,#cy-groups{width:100%;height:100%;}
/* ════════ AGRUPAR CÓDIGOS / CATEGORÍAS ════════ */
.nube-subtabs{display:flex;gap:.4rem;flex-wrap:wrap;margin:0 0 1rem;}
.nube-subtab{font-size:.74rem;}
.group-badge{display:inline-flex;align-items:center;justify-content:center;background:#7B5EA7;color:#fff;border-radius:6px;min-width:20px;height:20px;padding:0 6px;font-size:.68rem;font-family:'IBM Plex Mono',monospace;font-weight:700;margin-right:.35rem;}
.group-li{border-left:3px solid #7B5EA7;}
.group-li.sel{box-shadow:0 0 0 2px #7B5EA7 inset;border-radius:8px;}
.grp-child{font-size:.84rem;padding:.25rem .2rem;border-bottom:1px dashed var(--border);color:var(--text2);}
.grp-child:last-child{border-bottom:none;}
.grp-pick-wrap{max-height:200px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:.4rem;margin-top:.3rem;}
.mini-btn{font-size:.7rem;padding:.15rem .5rem;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text2);margin-left:.4rem;cursor:pointer;}
.mini-btn:hover{border-color:#7B5EA7;color:#7B5EA7;}
.grp-mark-tip{font-size:.72rem;color:var(--text3);margin-top:.3rem;}
.red-legend{display:flex;gap:.8rem;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;font-size:.65rem;color:var(--text3);align-items:center;}
.red-legend-item{display:flex;align-items:center;gap:.35rem;}
.red-legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.red-legend-line{width:24px;height:3px;flex-shrink:0;border-radius:2px;}
.red-info-panel{
  background:var(--card-bg);border:1px solid var(--card-border);border-radius:10px;
  padding:.9rem 1rem;min-height:3.5rem;font-size:.84rem;color:var(--text2);
  transition:opacity .2s;
}
.red-info-panel .rip-title{font-weight:600;color:var(--text);font-size:.92rem;margin-bottom:.25rem;}
.red-info-panel .rip-meta{font-family:'IBM Plex Mono',monospace;font-size:.66rem;color:var(--text3);}
.red-empty{text-align:center;padding:3rem 1rem;color:var(--empty);}
.red-empty-sigil{font-size:1.8rem;opacity:.35;margin-bottom:.5rem;}
.red-empty-text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.95rem;color:var(--text2);line-height:1.5;}
/* Actor form */
.actor-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;}
@media(max-width:560px){.actor-form-grid{grid-template-columns:1fr;}}
.actor-mini-list{display:flex;flex-direction:column;gap:.35rem;max-height:220px;overflow-y:auto;}
.actor-mini-item{display:flex;align-items:center;gap:.5rem;background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:.4rem .6rem;font-size:.82rem;}
.actor-mini-item .ami-name{flex:1;font-weight:600;}
.actor-mini-item .ami-role{font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:var(--text3);}
.actor-del{background:none;border:none;color:var(--text4);font-size:.9rem;padding:0 2px;cursor:pointer;line-height:1;}
.actor-del:hover{color:var(--amber);}
.red-section-label{font-family:'IBM Plex Mono',monospace;font-size:.64rem;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);margin:1rem 0 .5rem;}
.red-link-row{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;}
.red-link-row .field-sel,.red-link-row .field-in{font-size:.8rem;padding:.35rem .55rem;}
.actor-link-list{display:flex;flex-direction:column;gap:.3rem;max-height:180px;overflow-y:auto;}
.actor-link-item{display:flex;align-items:center;gap:.5rem;background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:.35rem .55rem;font-size:.78rem;}
.actor-link-item .ali-label{flex:1;color:var(--text);}
.ali-kind{font-family:'IBM Plex Mono',monospace;font-size:.6rem;padding:1px 5px;border-radius:3px;}
.ali-strong{background:rgba(45,106,79,.18);color:var(--green-mid);}
.ali-weak{background:rgba(184,92,56,.12);color:var(--amber);}
.ali-dash{background:rgba(123,94,167,.15);color:var(--purple);}
.red-tabs{display:flex;gap:.4rem;margin-bottom:1rem;flex-wrap:wrap;}
.red-tab{font-size:.78rem;padding:.38rem .75rem;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:.15s;}
.red-tab.active{background:var(--green-dark);color:var(--sidebar-text);border-color:var(--green-dark);}
.cy-controls{position:absolute;bottom:.7rem;right:.7rem;display:flex;flex-direction:column;gap:.3rem;z-index:10;}
.cy-ctrl-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--card-bg);color:var(--text2);font-size:.9rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;}
.cy-ctrl-btn:hover{border-color:var(--green-mid);color:var(--green-mid);}

.code-detail-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.3rem;}
.code-detail-name{font-family:'Cormorant Garamond',serif;font-size:1.7rem;font-weight:600;}
.frag-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:10px;padding:.9rem 1rem;margin-bottom:.8rem;cursor:pointer;transition:.15s;border-left:3px solid var(--green-mid);}
.frag-card:hover{border-color:var(--green-mid);box-shadow:0 3px 10px var(--shadow);}
.frag-src{font-family:'IBM Plex Mono',monospace;font-size:.66rem;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.35rem;display:flex;align-items:center;gap:.4rem;}
.frag-text{font-size:.9rem;line-height:1.65;color:var(--text);}
.frag-text .hl{background:var(--hl-yellow);border-radius:2px;padding:0 2px;}
.frag-note{font-size:.78rem;color:var(--text2);margin-top:.4rem;font-style:italic;border-top:1px dashed var(--border);padding-top:.4rem;}

/* ════════ MATERIALS / BIBLIO ════════ */
.upload-zone{border:2px dashed var(--border);border-radius:12px;padding:1.6rem 1rem;text-align:center;transition:.15s;background:var(--zone-bg);cursor:pointer;}
.upload-zone:hover,.upload-zone.drag{border-color:var(--green-mid);background:var(--code-bg);}
.upload-sym{font-size:1.6rem;color:var(--text3);margin-bottom:.4rem;}
.upload-text{font-size:.86rem;color:var(--text2);}
.upload-hint{font-size:.72rem;color:var(--text3);margin-top:.3rem;}
.mat-list{display:flex;flex-direction:column;gap:.6rem;margin-top:1.2rem;}
.mat-item{display:flex;align-items:center;gap:.7rem;background:var(--card-bg);border:1px solid var(--card-border);border-radius:9px;padding:.7rem .9rem;transition:.15s;}
.mat-item:hover{border-color:var(--green-mid);}
.mat-sym{font-size:1.1rem;flex-shrink:0;}
.mat-info{flex:1;min-width:0;}
.mat-name{font-weight:600;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mat-meta{font-family:'IBM Plex Mono',monospace;font-size:.64rem;color:var(--text3);}
.mat-actions{display:flex;gap:.3rem;flex-shrink:0;}
.icon-btn{background:none;border:1px solid var(--border);width:30px;height:30px;border-radius:7px;font-size:.85rem;color:var(--text2);display:flex;align-items:center;justify-content:center;transition:.15s;}
.icon-btn:hover{border-color:var(--green-mid);color:var(--green-mid);}
.icon-btn.danger:hover{border-color:var(--amber);color:var(--amber);}

.folder-bar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:1rem 0;}
.folder-chip{display:inline-flex;align-items:center;gap:.4rem;padding:.35rem .8rem;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:.78rem;}
.folder-chip.active{background:var(--purple);color:#fff;border-color:var(--purple);}
.folder-chip .fc-count{font-size:.66rem;opacity:.8;}

.link-mat-row{display:flex;align-items:center;gap:.5rem;padding:.4rem .5rem;border-radius:6px;font-size:.8rem;}
.link-mat-row:hover{background:var(--bg3);}
.link-mat-row input{accent-color:var(--green-mid);}

/* buscador de materiales */
.mat-search-bar{display:flex;align-items:center;gap:.5rem;margin:.7rem 0 .5rem;background:var(--input-bg);border:1px solid var(--input-border);border-radius:8px;padding:.4rem .7rem;transition:border .15s;}
.mat-search-bar:focus-within{border-color:var(--green-mid);}
.mat-search-bar input{background:none;border:none;outline:none;flex:1;font-family:inherit;font-size:.85rem;color:var(--text);}
.mat-search-bar .ms-icon{color:var(--text3);font-size:.9rem;flex-shrink:0;}
.mat-search-bar .ms-clear{background:none;border:none;color:var(--text3);font-size:.85rem;padding:0;line-height:1;}
.mat-search-count{font-family:'IBM Plex Mono',monospace;font-size:.62rem;color:var(--text3);margin-bottom:.4rem;}
.audio-rec{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:.6rem 0;}
.rec-dot{width:10px;height:10px;border-radius:50%;background:var(--amber);animation:bl 1s infinite;}

/* ════════ MODAL ════════ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:900;display:none;align-items:flex-start;justify-content:center;padding:2rem 1rem;overflow-y:auto;}
.modal-overlay.show{display:flex;}
.modal-box{background:var(--bg2);border:1px solid var(--border);border-radius:14px;max-width:640px;width:100%;box-shadow:0 12px 40px var(--shadow2);margin:auto;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.3rem;border-bottom:1px solid var(--border);}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:600;}
.modal-close{background:none;border:none;font-size:1.2rem;color:var(--text3);width:32px;height:32px;border-radius:8px;}
.modal-close:hover{background:var(--bg3);color:var(--text);}
.modal-body{padding:1.3rem;max-height:70vh;overflow-y:auto;}
.modal-foot{display:flex;gap:.6rem;justify-content:flex-end;padding:1rem 1.3rem;border-top:1px solid var(--border);flex-wrap:wrap;}

.err-detail{background:var(--err-bg);border:1px solid var(--err-border);border-radius:9px;padding:.8rem 1rem;margin-bottom:1rem;}
.err-detail-title{font-weight:600;color:var(--amber);margin-bottom:.3rem;font-size:.9rem;}
.err-detail-body{font-size:.82rem;color:var(--text2);line-height:1.6;}
.warn-box{background:rgba(184,92,56,.08);border:1px solid var(--err-border);border-radius:8px;padding:.6rem .8rem;font-size:.78rem;color:var(--text2);line-height:1.55;margin:.6rem 0;}
.warn-box strong{color:var(--amber);}

.md-sec{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:1px;text-transform:uppercase;color:var(--green-mid);margin:1em 0 .35em;font-weight:600;}
.md-bul{display:flex;gap:.45rem;margin:.25em 0;line-height:1.6;}
.md-dot{color:var(--green-mid);flex-shrink:0;}
.cita-out{background:var(--card-bg);border:1px solid var(--card-border);border-radius:9px;padding:1rem;font-size:.86rem;line-height:1.7;}
.cita-block{margin-bottom:1rem;}
.cita-block:last-child{margin-bottom:0;}

/* ════════ AGREGADOS ════════ */
/* Inicio: avisos y llamados a la acción (guía / mail) */
.device-warn{max-width:520px;margin:1rem auto 0;font-size:.78rem;line-height:1.6;color:var(--text2);background:rgba(184,92,56,.08);border:1px solid var(--err-border);border-radius:9px;padding:.7rem .9rem;text-align:left;}
.device-warn strong{color:var(--amber);}
.faro-cta{max-width:500px;margin:1.2rem auto 0;text-align:left;}
.faro-cta .cta-row{display:flex;align-items:flex-start;gap:.6rem;padding:.5rem 0;}
.faro-cta .cta-row+.cta-row{border-top:1px solid var(--border);}
.faro-cta .cta-sym{font-size:1.2rem;flex-shrink:0;margin-top:.1rem;}
.faro-cta .cta-title{font-weight:600;margin-bottom:.15rem;}
.faro-cta .cta-msg{font-size:.8rem;color:var(--text2);line-height:1.5;margin-bottom:.45rem;}

/* Indicador de scroll (móvil sobre todo) */
.scroll-hint{position:fixed;right:14px;bottom:84px;z-index:60;width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--card-bg);color:var(--green-mid);font-size:1.15rem;box-shadow:0 4px 14px var(--shadow2);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;transform:translateY(8px);display:flex;align-items:center;justify-content:center;}
.scroll-hint.show{opacity:1;pointer-events:auto;transform:translateY(0);animation:sh-bounce 1.6s ease-in-out infinite;}
@keyframes sh-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@media(min-width:761px){.scroll-hint{bottom:24px;}}

/* Trabajo en profundidad: workspace de dos columnas */
.deep-modetabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem;}
.deep-works-strip{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.5rem;margin-bottom:.4rem;}
.deep-work-chip{flex-shrink:0;display:inline-flex;align-items:center;gap:.45rem;background:var(--card-bg);border:1px solid var(--card-border);border-radius:20px;padding:.32rem .75rem;font-size:.76rem;color:var(--text2);white-space:nowrap;cursor:pointer;}
.deep-work-chip:hover{border-color:var(--blue);}
.deep-work-chip.active{border-color:var(--blue);color:var(--blue);background:rgba(42,90,140,.08);}
.deep-work-chip .dwx{background:none;border:none;color:var(--text3);padding:0;font-size:.85rem;line-height:1;}
.deep-work-chip .dwx:hover{color:var(--amber);}
.deep-chooser{display:flex;flex-wrap:wrap;gap:.35rem;max-height:200px;overflow:auto;}
.deep-pick{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--border);background:transparent;color:var(--text2);border-radius:18px;padding:.32rem .7rem;font-size:.78rem;line-height:1.3;text-align:left;}
.deep-pick:hover{border-color:var(--blue);}
.deep-pick.on{background:rgba(42,90,140,.12);border-color:var(--blue);color:var(--blue);}
.deep-pick .dp-check{font-weight:700;}
.deep-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:1rem;align-items:start;margin-top:.6rem;}
@media(max-width:860px){.deep-grid{grid-template-columns:1fr;}}
.deep-col-title{font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin:1.1rem 0 .5rem;}
.deep-col-title:first-child{margin-top:0;}
.deep-textbox{border:1px solid var(--card-border);border-radius:10px;background:var(--card-bg);margin-bottom:.7rem;overflow:hidden;}
.deep-textbox>summary{cursor:pointer;padding:.7rem .9rem;font-weight:600;font-size:.88rem;list-style:none;display:flex;align-items:center;gap:.5rem;}
.deep-textbox>summary::-webkit-details-marker{display:none;}
.deep-textbox>summary .dt-meta{font-family:'IBM Plex Mono',monospace;font-size:.62rem;font-weight:400;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;}
.deep-textbox>summary .dt-caret{margin-left:auto;color:var(--text3);}
.deep-textbox[open]>summary{border-bottom:1px solid var(--border);}
.deep-textbody{max-height:440px;overflow:auto;padding:1rem 1.1rem;}
.deep-textbody .doc-text{font-size:.94rem;line-height:1.85;}
.deep-frag{background:var(--card-bg);border:1px solid var(--card-border);border-left:3px solid var(--green-mid);border-radius:9px;padding:.7rem .9rem;margin-bottom:.55rem;}
.deep-frag .df-src{font-family:'IBM Plex Mono',monospace;font-size:.64rem;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:.35rem;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;}
.deep-frag .df-quote{font-size:.88rem;line-height:1.6;color:var(--text);}
.deep-frag .df-quote .hl{background:var(--hl-yellow);border-radius:2px;padding:0 2px;}
.deep-frag .df-actions{display:flex;gap:.35rem;margin-top:.5rem;flex-wrap:wrap;}
.deep-memo-card{margin-top:1.2rem;}
.deep-memo-actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.55rem;}
.deep-empty-side{font-size:.82rem;color:var(--text3);font-style:italic;font-family:'Cormorant Garamond',serif;}
.deep-go-row{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.3rem;}
.btn.blue{background:var(--blue);color:#fff;}
.btn.blue:hover{filter:brightness(1.08);}

.deepen-btn{background:none;border:1px solid var(--border);border-radius:6px;color:var(--blue);font-size:.72rem;padding:.2rem .5rem;display:inline-flex;align-items:center;gap:.25rem;}
.deepen-btn:hover{border-color:var(--blue);background:rgba(42,90,140,.08);}
/* Guía de uso */
.guide-sec{margin:1.1rem 0 .3rem;font-family:'Cormorant Garamond',serif;font-size:1.15rem;font-weight:600;color:var(--green-mid);}
.guide-step{display:flex;gap:.55rem;margin:.4rem 0;line-height:1.6;font-size:.88rem;}
.guide-step .gs-sym{flex-shrink:0;color:var(--green-mid);font-size:1rem;width:20px;text-align:center;}
.guide-tip{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:.6rem .8rem;font-size:.8rem;color:var(--text2);line-height:1.55;margin:.5rem 0;}

.translate-prompt{position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%);background:var(--bg2);border:1.5px solid var(--green-mid);border-radius:10px;padding:.6rem 1rem;display:flex;align-items:center;gap:.7rem;z-index:9999;box-shadow:0 4px 18px rgba(0,0,0,.18);font-size:.85rem;white-space:nowrap;animation:fadeInUp .25s ease;}
@keyframes fadeInUp{from{opacity:0;transform:translateX(-50%) translateY(12px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}

/* ── Feature 8: coding progress bar ── */
.coding-progress-wrap{margin:.5rem 0 .8rem;display:flex;align-items:center;gap:.6rem;}
.coding-progress-bar{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.coding-progress-fill{height:100%;background:var(--green-mid);border-radius:3px;transition:width .4s ease;}
.coding-progress-label{font-family:'IBM Plex Mono',monospace;font-size:.62rem;color:var(--text3);white-space:nowrap;}

/* ── Feature 7: tags on materials ── */
.mat-tags{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.3rem;}
.mat-tag{font-family:'IBM Plex Mono',monospace;font-size:.58rem;background:var(--code-bg);border:1px solid var(--code-border);border-radius:4px;padding:.1rem .4rem;color:var(--text2);}

.tag-input-wrap input{flex:1;}
.tags-filter-bar{display:flex;gap:.3rem;flex-wrap:wrap;margin:.4rem 0 .6rem;}
.tag-chip{font-size:.7rem;font-family:'IBM Plex Mono',monospace;padding:.2rem .55rem;border-radius:20px;border:1px solid var(--border);background:var(--bg2);cursor:pointer;transition:.12s;}
.tag-chip.active{background:var(--green-dark);color:var(--sidebar-text);border-color:var(--green-dark);}

/* ── Feature 1: AI result history panel ── */
.ai-history-panel{margin-top:.8rem;border-top:1px dashed var(--border);padding-top:.6rem;}
.ai-history-label{font-family:'IBM Plex Mono',monospace;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:.4rem;}
.ai-history-item{font-size:.8rem;color:var(--text2);padding:.35rem .5rem;border-radius:6px;cursor:pointer;border:1px solid transparent;transition:.12s;margin-bottom:.3rem;display:flex;align-items:flex-start;gap:.5rem;}
.ai-history-item:hover{background:var(--bg3);border-color:var(--border);}
.ai-history-item-date{font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:var(--text3);white-space:nowrap;flex-shrink:0;margin-top:.1rem;}
.ai-history-item-preview{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}

/* ── Feature 6: drag reorder materials ── */
.mat-item.drag-over{border-color:var(--green-mid);background:var(--code-bg);}
.mat-item[draggable="true"]{cursor:grab;}
.mat-item[draggable="true"]:active{cursor:grabbing;opacity:.7;}
.drag-handle{cursor:grab;color:var(--text3);font-size:.9rem;padding:0 .2rem;flex-shrink:0;}

/* ── Feature 9: compare analyses button ── */
.ana-compare-btn{font-size:.72rem;padding:.2rem .5rem;margin-top:.4rem;}

/* ── Feature 11: show more pagination ── */
.show-more-btn{display:block;width:100%;margin-top:.5rem;padding:.5rem;background:none;border:1px dashed var(--border);border-radius:8px;color:var(--text3);font-size:.8rem;cursor:pointer;transition:.15s;}

.ed-unsaved-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:.4rem;vertical-align:middle;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

// ═══════════════════════════════════════════════════════════════════════════
// INTERNACIONALIZACIÓN — sistema i18n ES / EN
// ═══════════════════════════════════════════════════════════════════════════
let lang = "es"; // "es" | "en"

function t(key){
  const node = LANG[key];
  if(!node) return key;
  return node[lang] !== undefined ? node[lang] : node["es"];
}

async function setLang(l){
  const prev = lang;
  lang = l;
  await idbSet("kv","lang",l);
  document.documentElement.lang = l === "en" ? "en" : "es";
  applyLangBtn();
  render();
  // If there are active AI results, offer to translate them
  if(prev !== l && aiEnabled()) {
    const hasWorkOut = !!(workAiOut && workAiOut.trim());
    const hasRecOut = !!(recOut && recOut.trim());
    if(hasWorkOut || hasRecOut) {
      const label = l === "en" ? "Translate results to English?" : "¿Traducir resultados al español?";
      const btnLabel = l === "en" ? "Translate" : "Traducir";
      showTranslatePrompt(label, btnLabel, l);
    }
  }
}
function applyLangBtn(){
  const btn = document.getElementById("lang-btn");
  if(btn) btn.textContent = lang === "en" ? "EN" : "ES";
}

// ── Translate active AI results when language switches ──
let _translateToast = null;
function showTranslatePrompt(label, btnLabel, targetLang){
  // Remove any existing translate prompt
  if(_translateToast && _translateToast.parentNode) _translateToast.remove();
  const el = document.createElement("div");
  el.className = "translate-prompt";
  el.innerHTML = `<span>${label}</span><button class="btn green sm" id="tp-yes">${btnLabel}</button><button class="btn outline sm" id="tp-no">✕</button>`;
  document.body.appendChild(el);
  _translateToast = el;
  // Auto-dismiss after 12 seconds
  const timer = setTimeout(()=>{ if(el.parentNode) el.remove(); }, 12000);
  el.querySelector("#tp-yes").onclick = ()=>{ clearTimeout(timer); el.remove(); translateAiResults(targetLang); };
  el.querySelector("#tp-no").onclick = ()=>{ clearTimeout(timer); el.remove(); };
}

async function translateAiResults(targetLang){
  const targetName = targetLang === "en" ? "English" : "Spanish";
  const instruction = targetLang === "en"
    ? `Translate the following text to English. Preserve all markdown formatting (**, *, headers, bullet points). Only translate — do not add, remove, or summarize content:\n\n`
    : `Traducí el siguiente texto al español. Preservá todo el formato markdown (**, *, encabezados, listas). Solo traducí — no agregues, quites ni resumas contenido:\n\n`;

  // Translate workAiOut if present
  if(workAiOut && workAiOut.trim() && route !== "recomendar"){
    try {
      const original = workAiOut;
      workAiOut = "";
      workAiLoading = true;
      render();
      let acc = "";
      await streamGemini("", instruction + original, (ch)=>{
        acc += ch; workAiOut = acc;
        throttledStreamRender(()=>acc, ".ai-out");
      }, {maxTokens:6000, temperature:0.1});
      workAiOut = acc;
    } catch(e) { /* keep original */ }
    workAiLoading = false;
    render();
  }

  // Translate recOut if present
  if(recOut && recOut.trim() && route === "recomendar"){
    try {
      const original = recOut;
      recOut = "";
      recLoading = true;
      renderRecomendarView();
      let acc = "";
      await streamGemini("", instruction + original, (ch)=>{
        acc += ch; recOut = acc;
        throttledStreamRender(()=>acc, "#rec-out");
      }, {maxTokens:8000, temperature:0.1});
      recOut = acc;
    } catch(e) { /* keep original */ }
    recLoading = false;
    renderRecomendarView();
  }
}

// Secciones fijas de cada modo de trabajo (panel derecho, como pestañas).
function getCodificarSections(){ return lang==="en"?[
  { key:"resuenan",   title:"Resonant words",             desc:"Terms from the material itself carrying significant weight." },
  { key:"entradas",   title:"Possible analytical entries", desc:"Concepts or categories that could organize the analysis." },
  { key:"borde",      title:"What stays at the edge",      desc:"The marginal, what doesn't fit easily, what the code doesn't capture." },
  { key:"preguntas",  title:"Questions to return to fieldwork",desc:"Questions for the next fieldwork session." },
  { key:"conexion",   title:"A possible connection",       desc:"Link to relevant theoretical or empirical literature." },
]:[
  { key:"resuenan",   title:"Palabras que resuenan",      desc:"Términos del propio material con carga significativa." },
  { key:"entradas",   title:"Posibles entradas analíticas",desc:"Conceptos o categorías que podrían organizar el análisis." },
  { key:"borde",      title:"Lo que queda en el borde",   desc:"Lo marginal, lo que no encaja fácil, lo que el código no captura." },
  { key:"preguntas",  title:"Preguntas para volver al campo",desc:"Interrogantes para la próxima instancia de trabajo de campo." },
  { key:"conexion",   title:"Una conexión posible",       desc:"Vínculo con literatura teórica o empírica relevante." },
]; }
function getAnalizarSections(){ return lang==="en"?[
  { key:"pasando",    title:"What's happening?",           desc:"Description of what occurs in the material." },
  { key:"tensiones",  title:"Tensions it opens",           desc:"Contradictions, dilemmas, internal frictions." },
  { key:"escalas",    title:"Scales at play",              desc:"Micro/macro, individual/collective, local/global." },
  { key:"abiertas",   title:"Questions it leaves open",    desc:"Questions the fragment generates or doesn't resolve." },
  { key:"hilo",       title:"If I had to bet on one thread",desc:"Provisional interpretive hypothesis." },
  { key:"densa",      title:"Help for thick description",  desc:"Denser, more situated writing variants, without replacing your text." },
]:[
  { key:"pasando",    title:"¿Qué está pasando?",         desc:"Descripción de lo que ocurre en el material." },
  { key:"tensiones",  title:"Tensiones que abre",         desc:"Contradicciones, dilemas, fricciones internas." },
  { key:"escalas",    title:"Escalas en juego",           desc:"Micro/macro, individual/colectivo, local/global." },
  { key:"abiertas",   title:"Preguntas que deja abiertas",desc:"Interrogantes que el fragmento genera o no resuelve." },
  { key:"hilo",       title:"Si tuviera que apostar a un hilo",desc:"Hipótesis interpretativa provisional." },
  { key:"densa",      title:"Ayuda para descripción densa",desc:"Variantes de escritura más densas y situadas, sin reemplazar tu texto." },
]; }
const CODIFICAR_SECTIONS = new Proxy([],{get(_,k){return getCodificarSections()[k];}});
const ANALIZAR_SECTIONS = new Proxy([],{get(_,k){return getAnalizarSections()[k];}});

// STORAGE — IndexedDB (kv para estado, files para blobs grandes)
// ═══════════════════════════════════════════════════════════════════════════
const DB_NAME = "cuaderno-etno";
const DB_VER = 1;
let _db = null;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains("kv")) db.createObjectStore("kv");
      if(!db.objectStoreNames.contains("files")) db.createObjectStore("files");
    };
    req.onsuccess = ()=>{ _db = req.result; resolve(_db); };
    req.onerror = ()=>reject(req.error);
  });
}
function idbGet(store,key){
  return new Promise((resolve,reject)=>{
    const tx=_db.transaction(store,"readonly").objectStore(store).get(key);
    tx.onsuccess=()=>resolve(tx.result); tx.onerror=()=>reject(tx.error);
  });
}
function idbSet(store,key,val){
  return new Promise((resolve,reject)=>{
    const tx=_db.transaction(store,"readwrite").objectStore(store).put(val,key);
    tx.onsuccess=()=>resolve(true); tx.onerror=()=>reject(tx.error);
  });
}
function idbDel(store,key){
  return new Promise((resolve,reject)=>{
    const tx=_db.transaction(store,"readwrite").objectStore(store).delete(key);
    tx.onsuccess=()=>resolve(true); tx.onerror=()=>reject(tx.error);
  });
}

// Claves de estado en kv
const KV = ["project","materials","folders","savedCodes","savedAnalyses","cats","aiOn","theme","apiKey","model","introSeen","history"];

async function loadState(){
  await openDB();
  // Migración desde localStorage (versión vieja) si IDB está vacío.
  const migrated = await idbGet("kv","_migrated");
  let migratedNow=false;
  if(!migrated){ await migrateFromLocalStorage(); migratedNow=true; }

  const g = async (k)=> await idbGet("kv",k);
  const p = await g("project"); if(p) project = {...project, ...p};
  // unificar campo viejo dentro de población (una sola vez)
  if(project.campo && project.campo.trim()){ project.poblacion=[project.campo,project.poblacion].filter(x=>x&&x.trim()).join(" · "); project.campo=""; }
  const m = await g("materials"); if(Array.isArray(m)) materials = m;
  const f = await g("folders"); if(Array.isArray(f)) folders = f;
  const sc = await g("savedCodes"); if(Array.isArray(sc)) savedCodes = sc;
  const cg = await g("codeGroups"); if(Array.isArray(cg)) codeGroups = cg;
  const sa = await g("savedAnalyses"); if(Array.isArray(sa)) savedAnalyses = sa;
  const rc = await g("recomendaciones"); if(Array.isArray(rc)) recomendaciones = rc;
  const dn = await g("deepNotes"); if(Array.isArray(dn)) deepNotes = dn;
  const dw = await g("deepWorks"); if(Array.isArray(dw)) deepWorks = dw;
  const dm = await g("deepMemos"); if(dm && typeof dm==="object") deepMemos = dm;
  // Migración: notas viejas de profundidad → trabajos en profundidad (una sola vez)
  if(!deepWorks.length && deepNotes.length){
    deepWorks = deepNotes.map(n=>({id:n.id||uid("dw"),title:(n.title||n.body||"Trabajo en profundidad").slice(0,80),mode:"textos",items:Array.isArray(n.matIds)?n.matIds:[],note:n.body||"",date:n.date||today()}));
  }
  const ct = await g("cats"); if(ct) cats = ct;
  const h = await g("history"); if(Array.isArray(h)) history = h;
  const ai = await g("aiOn"); aiOn = (ai===undefined||ai===null) ? true : ai;
  const th = await g("theme"); darkMode = (th===undefined||th===null) ? false : th; // req 17: predeterminado claro
  const ac = await g("actores"); if(Array.isArray(ac)) actores = ac;
  const al = await g("actorLinks"); if(Array.isArray(al)) actorLinks = al;
  const lg = await g("lang"); if(lg==="en"||lg==="es") lang = lg;
  return migratedNow;
}

async function migrateFromLocalStorage(){
  try{
    const L = (k)=>{ try{const r=localStorage.getItem(k); return r?JSON.parse(r):null;}catch{return null;} };
    const oldProj = L("etno-project");
    if(oldProj){
      // mapear campos viejos → nuevos (req 7)
      project.tema = oldProj.tema || "";
      project.objetivoGeneral = oldProj.objetivos || "";
      project.enfoque = oldProj.enfoque || "";
      project.campo = oldProj.campo || "";
      // 'preguntas' viejo se descarta como campo (req 7), pero lo preservamos en estado del arte por las dudas
      if(oldProj.preguntas) project.estadoArte = "";
    }
    const oldMats = L("etno-materials");
    if(Array.isArray(oldMats)) materials = oldMats.map(m=>({...m, folder:m.folder||null, anns:m.anns||[]}));
    const oldDocs = L("etno-docs");
    if((!oldMats||oldMats.length===0) && Array.isArray(oldDocs)){
      materials = oldDocs.map(d=>({id:d.id,type:"documentos",name:d.name,text:d.text,folder:null,date:new Date().toLocaleDateString("es-AR"),anns:[]}));
    }
    const oldNotes = L("etno-notes");
    if(Array.isArray(oldNotes)) oldNotes.forEach(n=>{ if(n.text) materials.push({id:n.id||("mat_"+Math.random().toString(36).slice(2)),type:"notas-campo",name:n.title||"Nota",text:n.text,folder:null,date:new Date().toLocaleDateString("es-AR"),anns:[]}); });
    const oldCats = L("etno-cats"); if(oldCats) cats = oldCats;
    const oldCodes = L("etno-saved-codes"); if(Array.isArray(oldCodes)) savedCodes = oldCodes.map(c=>({id:c.id,code:c.code,date:c.date||""}));
    const oldAna = L("etno-saved-analyses"); if(Array.isArray(oldAna)) savedAnalyses = oldAna;
    const oldKey = L("etno-api-key"); if(oldKey) await idbSet("kv","apiKey",oldKey);
    const oldModel = L("etno-model"); if(oldModel) await idbSet("kv","model",oldModel);
    // persistir lo migrado
    await idbSet("kv","project",project);
    await idbSet("kv","materials",materials);
    await idbSet("kv","savedCodes",savedCodes);
    await idbSet("kv","savedAnalyses",savedAnalyses);
    await idbSet("kv","cats",cats);
  }catch(e){ /* migración best-effort */ }
  await idbSet("kv","_migrated",true);
}

function markDirty(){ setSavePill("dirty"); scheduleSave(); }
function scheduleSave(){
  if(_saveTimer) clearTimeout(_saveTimer);
  setSavePill("saving");
  _saveTimer=setTimeout(()=>{ persist(true); }, 800);
}

    await idbSet("kv","project",project);

    await idbSet("kv","history",history.slice(0,12));

  el.className="save-pill "+s;

}

function projectFilled(){ return Object.values(project).some(v=>v && v.trim()); }
function projectContext(){
  if(!projectFilled()) return "";
  const p=project; let c="\n\n— MARCO DEL PROYECTO (operá siempre dentro de este marco) —\n";
  if(p.tema) c+=`Tema: ${p.tema}\n`;
  if(p.objetivoGeneral) c+=`Objetivo central: ${p.objetivoGeneral}\n`;
  if(p.objetivosEspecificos) c+=`Objetivos específicos: ${p.objetivosEspecificos}\n`;
  if(p.enfoque) c+=`Enfoque teórico: ${p.enfoque}\n`;
  const pob=[p.campo,p.poblacion].filter(x=>x&&x.trim()).join(" · ");
  if(pob) c+=`Población (sujetos, espacios, etc.): ${pob}\n`;
  if(p.estadoArte) c+=`Estado del arte: ${p.estadoArte}\n`;
  if(p.metodologia) c+=`Metodología: ${p.metodologia}\n`;
  c+="No impongas tu lectura: ofrecé aperturas dentro de este marco.\n—";
  return c;
}
// Memoria acumulada: códigos, análisis y recomendaciones ya existentes (la "nube" como insumo de la IA).
function priorWorkContext(){
  let c="";
  if(savedCodes.length){
    c+="\n\n— CÓDIGOS YA CREADOS EN EL PROYECTO (no los repitas; construí sobre ellos, proponé códigos nuevos o vinculaciones con estos) —\n";
    c+=savedCodes.map(x=>"· "+x.code).join("\n");
  }
  if(savedAnalyses.length){
    c+="\n\n— ANÁLISIS YA TRABAJADOS (no repitas estas líneas; avanzá sobre lo ya pensado) —\n";
    c+=savedAnalyses.slice(-8).map(a=>"· "+a.title+(a.body?": "+a.body.slice(0,160):"")).join("\n");
  }
  if(recomendaciones.length){
    c+="\n\n— RECOMENDACIONES / PREGUNTAS GUARDADAS (insumo para seguir pensando; retomalas si son pertinentes) —\n";
    c+=recomendaciones.slice(-10).map(r=>"· ["+r.kind+"] "+(r.title||"")+(r.body?": "+r.body.slice(0,140):"")).join("\n");
  }
  c+=deepWorkContext();
  return c;
}
// Materiales vinculados como insumo (req 3, on-demand para economizar tokens).
function linkedMaterialsContext(){
  if(!workLinkedMats.length) return "";
  let c="\n\n— MATERIALES BIBLIOGRÁFICOS VINCULADOS (usalos como insumo; citá de dónde sale cada idea) —\n";
  for(const id of workLinkedMats){
    const m=materials.find(x=>x.id===id); if(!m) continue;
    c+=`\n[${m.name}]\n${(m.text||"").slice(0,3500)}\n`;
  }
  return c;
}

function diagnoseGeminiError(status, errorBody){
  const msg=(errorBody?.error?.message||"").toLowerCase();
  const code=errorBody?.error?.code||status;
  const errStatus=(errorBody?.error?.status||"").toUpperCase();
  if(!hasKey()) return {title:"⚠ Aún no configuraste tu clave de Gemini",detail:"Las funciones con IA están desactivadas. Andá a Configuración para activarlas: es gratis y toma 5 minutos.",action:"config"};
  if(status===0||status===undefined) return {title:"⚠ Sin conexión",detail:"No se pudo contactar con Google. Verificá tu conexión a internet y probá de nuevo.",action:"retry"};
  if(code===400 && msg.includes("api key not valid")) return {title:"⚠ La clave no es válida",detail:"Google no reconoce esa clave. Suele empezar con 'AIza' (~39 caracteres). Volvé a Configuración y pegала de nuevo.",action:"config"};
  if(code===400) return {title:"⚠ Solicitud incorrecta",detail:"Google rechazó la solicitud. Si era un archivo muy grande, probá uno más chico. Detalle: "+(errorBody?.error?.message||"—"),action:"retry"};
  if(code===401||code===403){
    if(msg.includes("region")||msg.includes("country")||msg.includes("location")) return {title:"⚠ Bloqueo geográfico",detail:"Google bloqueó la solicitud por la ubicación. Si tenés VPN activa, desactivala.",action:"config"};
    return {title:"⚠ Permiso denegado",detail:"Revisá que tu clave sea correcta y que aceptaste los términos en aistudio.google.com con la misma cuenta.",action:"config"};
  }
  if(code===429) return {title:"⚠ Llegaste al tope de consultas",detail:"Excediste el límite gratuito de Gemini para este modelo. Esperá un minuto. Si pasa seguido, cambiá a 'Flash-Lite' en Configuración (1.000/día).",action:"config"};
  if(code===413||msg.includes("too large")||msg.includes("size")) return {title:"⚠ Archivo demasiado grande",detail:"El contenido supera el límite de la API. Probá un archivo más liviano o partilo.",action:"retry"};
  if(code>=500) return {title:"⚠ Error del servidor de Google",detail:"Problema en los servidores de Google. Esperá unos minutos.",action:"retry"};
  return {title:"⚠ Error inesperado",detail:"Detalle: "+JSON.stringify(errorBody?.error||{status}),action:"retry"};
}
function buildGeminiBody(system,userContent,options={}){
  const userParts=(typeof userContent==="string")?[{text:userContent}]:userContent;
  const body={
    systemInstruction:{parts:[{text:system}]},
    contents:[{role:"user",parts:userParts}],
    generationConfig:{maxOutputTokens:options.maxTokens||4000,temperature:options.temperature??0.8,topP:0.95},
    safetySettings:[
      {category:"HARM_CATEGORY_HARASSMENT",threshold:"BLOCK_ONLY_HIGH"},
      {category:"HARM_CATEGORY_HATE_SPEECH",threshold:"BLOCK_ONLY_HIGH"},
      {category:"HARM_CATEGORY_SEXUALLY_EXPLICIT",threshold:"BLOCK_ONLY_HIGH"},
      {category:"HARM_CATEGORY_DANGEROUS_CONTENT",threshold:"BLOCK_ONLY_HIGH"}
    ]
  };
  // Grounding con Google Search (gratis hasta 500/día en modelos 2.5, sin tarjeta).
  if(options.grounding) body.tools=[{google_search:{}}];
  return body;
}

// Extrae las fuentes (enlaces) que devuelve el grounding.
function extractSources(meta){
  if(!meta) return [];
  const chunks=meta.groundingChunks||[];
  const out=[];
  chunks.forEach(ch=>{ const w=ch.web||ch.retrievedContext; if(w&&w.uri) out.push({title:w.title||w.uri,uri:w.uri}); });
  // dedupe por uri
  const seen=new Set();
  return out.filter(s=>{ if(seen.has(s.uri))return false; seen.add(s.uri); return true; });
}
let lastSources=[]; // fuentes del último llamado con grounding
// Throttle de render para streams largos: evita re-parsear markdown en cada chunk (freeze de UI).
let _streamRenderPending=false;
function throttledStreamRender(getAcc,selector){
  if(_streamRenderPending) return;
  _streamRenderPending=true;
  requestAnimationFrame(()=>{
    _streamRenderPending=false;
    const box=document.querySelector(selector);
    if(box) box.innerHTML=renderMd(getAcc())+'<span class="cursor-blink"></span>';
  });
}
async function streamGemini(system,userContent,onChunk,options={}){
  if(!hasKey()) throw {_diag:diagnoseGeminiError(undefined,{})};
  lastSources=[];
  const url=`${GEMINI_BASE}/${encodeURIComponent(getModel())}:streamGenerateContent?alt=sse&key=${encodeURIComponent(getKey())}`;
  let res;
  try{ res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(buildGeminiBody(system,userContent,options))}); }
  catch{ throw {_diag:diagnoseGeminiError(0,{})}; }
  if(!res.ok){ let b={}; try{b=await res.json();}catch{} throw {_diag:diagnoseGeminiError(res.status,b)}; }
  const reader=res.body.getReader(); const dec=new TextDecoder(); let buf="";
  while(true){
    const {done,value}=await reader.read(); if(done) break;
    buf+=dec.decode(value,{stream:true});
    const lines=buf.split("\n"); buf=lines.pop();
    for(const l of lines){
      const line=l.trim(); if(!line.startsWith("data:")) continue;
      const data=line.slice(5).trim(); if(!data||data==="[DONE]") continue;
      try{
        const p=JSON.parse(data);
        const fr=p.candidates?.[0]?.finishReason;
        if(fr==="SAFETY"||fr==="RECITATION") throw {_diag:{title:"⚠ Respuesta bloqueada por Google",detail:"Gemini bloqueó la respuesta (motivo: "+fr+"). Probá reformular o cambiar de modelo.",action:"retry"}};
        const src=extractSources(p.candidates?.[0]?.groundingMetadata); if(src.length) lastSources=src;
        const txt=p.candidates?.[0]?.content?.parts?.[0]?.text; if(txt) onChunk(txt);
        if(fr==="MAX_TOKENS") onChunk("\n\n*[⚠ Respuesta cortada por límite de tokens — pedí continuar si falta texto]*");
      }catch(e){ if(e._diag) throw e; }
    }
  }
}
async function callGemini(system,userContent,options={}){
  if(!hasKey()) throw {_diag:diagnoseGeminiError(undefined,{})};
  lastSources=[];
  const url=`${GEMINI_BASE}/${encodeURIComponent(getModel())}:generateContent?key=${encodeURIComponent(getKey())}`;
  let res;
  try{ res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(buildGeminiBody(system,userContent,options))}); }
  catch{ throw {_diag:diagnoseGeminiError(0,{})}; }
  if(!res.ok){ let b={}; try{b=await res.json();}catch{} throw {_diag:diagnoseGeminiError(res.status,b)}; }
  const data=await res.json();
  const fr=data.candidates?.[0]?.finishReason;
  if(fr==="SAFETY"||fr==="RECITATION") throw {_diag:{title:"⚠ Respuesta bloqueada",detail:"Gemini bloqueó la respuesta (motivo: "+fr+").",action:"retry"}};
  lastSources=extractSources(data.candidates?.[0]?.groundingMetadata);
  return data.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("")||"";
}
async function testGeminiConnection(){
  if(!hasKey()) return {ok:false,diag:diagnoseGeminiError(undefined,{})};
  try{ const out=await callGemini(lang==="en"?"Respond with one word only.":"Respondé en una sola palabra.",lang==="en"?"Say only: ready":"Decí únicamente: listo",{maxTokens:20,temperature:0.1}); return {ok:true,sample:out}; }

// ── Transcripción de audio vía Gemini (req 14) ──
function blobToBase64(blob){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result.split(",")[1]);
    r.onerror=()=>reject(new Error("No se pudo leer el audio."));
    r.readAsDataURL(blob);
  });
}
async function transcribeAudio(blob, mime){
  if(!hasKey()) throw {_diag:diagnoseGeminiError(undefined,{})};
  if(blob.size > 18*1024*1024) throw new Error("El audio supera ~18 MB (límite para transcripción directa). Recortalo o convertilo a un formato más comprimido (mp3/ogg).");
  const b64=await blobToBase64(blob);
  const parts=[
    {inlineData:{mimeType:mime||blob.type||"audio/mpeg", data:b64}},
    {text:lang==="en"?"Transcribe this audio faithfully as continuous text. Do not add comments, titles, or summaries: only the transcription. If there are multiple distinguishable speakers, mark them as «—».":"Transcribí este audio al español en texto corrido y fiel. No agregues comentarios, títulos ni resúmenes: solo la transcripción. Si hay varios hablantes y se distinguen, marcalos como «—»."}
  ];
  return await callGemini("Sos un transcriptor preciso. Devolvés solo la transcripción del audio, sin agregados.", parts, {maxTokens:4000,temperature:0.1});
}

function renderMd(text){
  if(!text) return "";
  // inline: bold, italic, inline-code, links
  const ri=t=>t
    .replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>")
    .replace(/\*(.*?)\*/g,"<em>$1</em>")
    .replace(/`([^`]+)`/g,'<code style="font-family:\'IBM Plex Mono\',monospace;font-size:.85em;background:var(--code-bg);border:1px solid var(--code-border);border-radius:3px;padding:.1em .3em">$1</code>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener" style="color:var(--green-mid)">$1</a>');
  const lines=(text||"").split("\n");
  let html="", inCode=false, codeLang="", codeBuf=[], inTable=false, tableRows=[];

  const flushTable=()=>{
    if(!tableRows.length){inTable=false;return;}
    let th=tableRows[0], rows=tableRows.slice(2); // skip separator row
    html+=`<table style="width:100%;border-collapse:collapse;font-size:.84rem;margin:.5em 0">`;
    const thCells=th.split("|").map(x=>x.trim()).filter(x=>x);
    html+=`<tr>${thCells.map(c=>`<th style="border-bottom:2px solid var(--border);padding:.3rem .5rem;text-align:left;font-family:'IBM Plex Mono',monospace;font-size:.72rem;text-transform:uppercase;color:var(--green-mid)">${ri(esc(c))}</th>`).join("")}</tr>`;
    rows.forEach(r=>{ const cells=r.split("|").map(x=>x.trim()).filter(x=>x); if(cells.length) html+=`<tr>${cells.map(c=>`<td style="border-bottom:1px solid var(--border2);padding:.3rem .5rem">${ri(esc(c))}</td>`).join("")}</tr>`; });
    html+=`</table>`;
    tableRows=[]; inTable=false;
  };

  for(let i=0;i<lines.length;i++){
    const raw=lines[i]; const tr=raw.trim();
    // fenced code blocks
    if(tr.startsWith("```")){
      if(!inCode){ inCode=true; codeLang=tr.slice(3).trim(); codeBuf=[]; }
      else { const code=codeBuf.join("\n"); html+=`<pre style="background:var(--code-bg);border:1px solid var(--code-border);border-radius:7px;padding:.7rem .9rem;overflow-x:auto;font-family:'IBM Plex Mono',monospace;font-size:.78rem;line-height:1.6;margin:.4em 0">${esc(code)}</pre>`; inCode=false; codeBuf=[]; }
      continue;
    }
    if(inCode){ codeBuf.push(raw); continue; }
    // tables
    if(tr.includes("|")){
      if(!inTable) inTable=true;
      tableRows.push(tr); continue;
    } else if(inTable){ flushTable(); }
    // headings
    const hm=tr.match(/^(#{1,4})\s+(.+)$/);
    if(hm){ const lvl=hm[1].length; const sizes=["1.1rem","1rem",".9rem",".84rem"]; html+=`<div class="md-sec" style="font-size:${sizes[lvl-1]||'.84rem'};margin:${lvl===1?".9em 0 .4em":".7em 0 .3em"}">${ri(esc(hm[2]))}</div>`; continue; }
    // bold-only headings (like **Title**)
    if(/^\*\*[^*]+\*\*:?\s*$/.test(tr)){ html+=`<div class="md-sec">${ri(esc(tr.replace(/\*\*/g,"").replace(/:$/,"")))}</div>`; continue; }
    // blockquote
    if(tr.startsWith("> ")){ html+=`<div style="border-left:3px solid var(--border);padding:.2rem .7rem;margin:.3rem 0;color:var(--text2);font-style:italic">${ri(esc(tr.slice(2)))}</div>`; continue; }
    // bullet list (with optional nesting indent)
    const bulm=raw.match(/^(\s*)[-•*]\s+(.+)$/);
    if(bulm){ const indent=bulm[1].length; html+=`<div class="md-bul" style="margin-left:${indent*0.6}rem"><span class="md-dot">${indent>0?"▸":"◦"}</span><span>${ri(esc(bulm[2]))}</span></div>`; continue; }
    // numbered list
    const numm=raw.match(/^(\s*)\d+[.)]\s+(.+)$/);
    if(numm){ const indent=numm[1].length; html+=`<div class="md-bul" style="margin-left:${indent*0.6}rem"><span class="md-dot" style="font-family:'IBM Plex Mono',monospace">#</span><span>${ri(esc(numm[2]))}</span></div>`; continue; }
    // horizontal rule
    if(/^([-*_]){3,}$/.test(tr)){ html+=`<hr style="border:none;border-top:1px solid var(--border);margin:.6em 0">`; continue; }
    // empty line
    if(tr===""){ html+=`<div style="height:.45em"></div>`; continue; }
    // paragraph
    html+=`<p style="margin:0 0 .35em">${ri(esc(tr))}</p>`;
  }
  if(inTable) flushTable();
  if(inCode && codeBuf.length) html+=`<pre style="background:var(--code-bg);border:1px solid var(--code-border);border-radius:7px;padding:.7rem .9rem;overflow-x:auto;font-family:'IBM Plex Mono',monospace;font-size:.78rem;line-height:1.6;margin:.4em 0">${esc(codeBuf.join("\n"))}</pre>`;
  return html;
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function uid(p){return (p||"id")+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7);}
function today(){return new Date().toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"2-digit"});}
function matsOfType(t){return materials.filter(m=>m.type===t);}
function activeMat(){return materials.find(m=>m.id===activeMatId)||null;}
function findCode(idOrName){return savedCodes.find(c=>c.id===idOrName||c.code.toLowerCase()===String(idOrName).toLowerCase());}
// ── Categorías (códigos que agrupan otros códigos) ──
function findGroup(idOrName){return codeGroups.find(g=>g.id===idOrName||g.name.toLowerCase()===String(idOrName).toLowerCase());}
function groupsOfCode(codeId){return codeGroups.filter(g=>(g.members||[]).includes(codeId));}
// Asigna a cada categoría una marca corta y única (1ª letra; ante choque, suma la próxima consonante o letra).
function groupTags(){
  const tags={}; const used=new Set();
  const isCons=ch=>/[BCDFGHJKLMNÑPQRSTVWXYZ]/.test(ch);
  codeGroups.forEach(g=>{
    const up=(g.name||"").trim().toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-ZÑ]/g,"");
    if(!up){ let t="#",k=1; while(used.has(t)){t="#"+(k++);} used.add(t); tags[g.id]=t; return; }
    let tag=up[0];
    if(!used.has(tag)){ used.add(tag); tags[g.id]=tag; return; }
    // choque: arma marca de 2 letras = inicial + próxima consonante (si no hay, próxima letra)
    let second="";
    for(let i=1;i<up.length;i++){ if(isCons(up[i])){ second=up[i]; break; } }
    if(!second && up.length>1) second=up[1];
    let cand=tag+(second?second.toLowerCase():""); let k=2;
    while(!cand || used.has(cand)){ cand=tag+(k++); }
    used.add(cand); tags[g.id]=cand;
  });
  return tags;
}
// Marca(s) entre paréntesis para un código que pertenece a una o más categorías. Solo para mostrar; nunca altera el nombre guardado.
function codeMarks(codeId){
  const gs=groupsOfCode(codeId); if(!gs.length) return "";
  const tags=groupTags();
  return codeGroups.filter(g=>(g.members||[]).includes(codeId)).map(g=>"("+tags[g.id]+")").join("");
}
// Nombre a mostrar de un código: marca(s) + nombre. NO se guarda; se calcula al vuelo.
function codeDisplayName(codeId){
  const c=findCode(codeId); if(!c) return "";
  const mk=codeMarks(codeId);
  return (mk?mk+" ":"")+c.code;
}
