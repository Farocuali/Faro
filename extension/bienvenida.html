<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FARO</title>
  <style>
    :root { --fondo:#fbf8f1; --texto:#1d2433; --suave:#5f6778; --borde:#e2ded4; --acento:#1f3a5f; --luz:#e8a33d; --luz-suave:#fbeed8; --tarjeta:#fff; }
    @media (prefers-color-scheme: dark) { :root { --fondo:#12161e; --texto:#e8e6e1; --suave:#9aa1b0; --borde:#2c3442; --acento:#8fb3e0; --luz:#f0b357; --luz-suave:#3a2f1e; --tarjeta:#1b212c; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--fondo); color: var(--texto); font: 16px/1.6 Georgia, "Times New Roman", serif; }
    main { max-width: 820px; margin: 0 auto; padding: 48px 20px 64px; }
    .marca { display: flex; align-items: center; gap: 16px; margin-bottom: 6px; }
    .marca img { width: 64px; height: 64px; }
    h1 { font-size: 34px; margin: 0; color: var(--acento); font-weight: 600; letter-spacing: .02em; }
    .bajada { color: var(--suave); margin: 4px 0 32px; font-size: 18px; }
    .pasos { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
    .paso { background: var(--tarjeta); border: 1px solid var(--borde); border-top: 3px solid var(--luz); border-radius: 12px; padding: 18px; }
    .num { font: 600 13px system-ui, sans-serif; color: var(--luz); letter-spacing: .1em; text-transform: uppercase; }
    h2 { font: 600 18px/1.3 system-ui, sans-serif; margin: 6px 0 8px; }
    .paso p { margin: 0; font-size: 15px; color: var(--suave); }
    kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--borde); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--tarjeta); }
    .acciones { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 32px; }
    button { font: 600 15px system-ui, sans-serif; border-radius: 8px; padding: 10px 18px; cursor: pointer; border: 1px solid var(--acento); background: var(--acento); color: var(--fondo); }
    button.sec { background: transparent; color: var(--acento); }
    .nota { margin-top: 28px; font-size: 14px; color: var(--suave); border-left: 3px solid var(--luz); padding-left: 12px; }
  </style>
</head>
<body>
<main>
  <div class="marca"><img src="icons/icon128.png" alt=""><h1>FARO</h1></div>
  <p class="bajada" id="bajada"></p>
  <div class="pasos" id="pasos"></div>
  <div class="acciones">
    <button id="abrir-faro"></button>
    <button class="sec" id="google"></button>
  </div>
  <p class="nota" id="nota"></p>
</main>
<script src="i18n.js"></script>
<script src="bienvenida.js"></script>
</body>
</html>
